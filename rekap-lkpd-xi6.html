<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rekap LKPD Kelompok XI-6 - SIPADAK</title>
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    
    const firebaseConfig = {
      apiKey: "AIzaSyBZIzD2337cdCxhV2EdcDMK3iwnaR0GiS4",
      authDomain: "sipadak-xi6.firebaseapp.com",
      projectId: "sipadak-xi6",
      storageBucket: "sipadak-xi6.firebasestorage.app",
      messagingSenderId: "981787419124",
      appId: "1:981787419124:web:6622e4bd0b928e9bea19a1"
    };
    const app = initializeApp(firebaseConfig);
    window.db = getFirestore(app);
  </script>

  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f3f5f4; margin: 0; padding: 20px; }
    .card { background: white; border-radius: 14px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 1100px; margin: 0 auto; }
    h2 { color: #0a3622; text-align: center; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 20px; }
    th, td { border: 1px solid #e5e7eb; padding: 12px; text-align: left; vertical-align: top; }
    th { background: #0a3622; color: white; text-align: center; }
    
    .btn-back { display: inline-block; background: #e2e8f0; color: #333; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-bottom: 20px; }
    .jawaban-text { white-space: pre-wrap; font-size: 13px; color: #333; max-height: 200px; overflow-y: auto; padding-right: 10px; }
    
    /* Menyembunyikan tombol kembali jika dibuka di iframe Dashboard Induk */
    body.di-dalam-iframe .btn-back { display: none; }
    
    .badge-kelompok { background: #e0f2fe; color: #0369a1; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; display: inline-block; margin-top: 5px; }
  </style>
</head>
<body>
  <div class="card">
    <a href="dashboard-induk.html" class="btn-back">⬅ Kembali ke Dashboard</a>
    
    <h2>📁 Rekap LKPD Diskusi Kelompok XI-6</h2>
    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th style="width: 5%;">No</th>
            <th style="width: 25%;">Nama Kelompok & Anggota</th>
            <th style="width: 15%;">Tanggal Kirim</th>
            <th style="width: 55%;">Hasil Diskusi (Jawaban)</th>
          </tr>
        </thead>
        <tbody id="listLKPD">
          <tr><td colspan="4" style="text-align:center; padding: 20px;">Memuat data dari Firebase...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    if (window.self !== window.top) {
      document.body.classList.add('di-dalam-iframe');
    }

    window.addEventListener('load', async () => {
      const tbody = document.getElementById("listLKPD");
      try {
        // Query memfilter kelas XI-6 pada koleksi HasilLKPD
        const q = query(collection(window.db, "HasilLKPD"), where("kelas", "==", "XI-6"));
        const snap = await getDocs(q);

        if (snap.empty) {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding: 20px;">Belum ada kelompok XI-6 yang mengirim LKPD.</td></tr>';
          return;
        }

        let dataLKPD = [];
        snap.forEach(doc => dataLKPD.push(doc.data()));
        
        // Urutkan berdasarkan tanggal terbaru
        dataLKPD.sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));

        let html = "";
        let no = 1;
        dataLKPD.forEach(d => {
          html += `
            <tr>
              <td style="text-align:center;">${no++}</td>
              <td>
                <b style="font-size: 15px; color: #0a3622;">${d.nama}</b>
                <div class="badge-kelompok">Oleh: ${d.ketua || '-'}</div>
                <div style="font-size: 12px; color: #64748b; margin-top: 8px; line-height: 1.4;">
                  <b>Anggota:</b><br>${d.anggota}
                </div>
              </td>
              <td style="text-align:center;">${d.tanggal}</td>
              <td>
                <div class="jawaban-text">${d.jawaban}</div>
              </td>
            </tr>
          `;
        });
        tbody.innerHTML = html;
      } catch (error) {
        console.error("Error Firebase:", error);
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:red; padding: 20px;">Gagal memuat data. Cek Console (F12).</td></tr>';
      }
    });
  </script>
</body>
</html>
