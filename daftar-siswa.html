<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar Akun Siswa - SIPADAK XI-6</title>
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, setDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
      apiKey: "AIzaSyBZIzD2337cdCxhV2EdcDMK3iwnaR0GiS4",
      authDomain: "sipadak-xi6.firebaseapp.com",
      projectId: "sipadak-xi6",
      storageBucket: "sipadak-xi6.firebasestorage.app",
      messagingSenderId: "981787419124",
      appId: "1:981787419124:web:6622e4bd0b928e9bea19a1"
    };

    const app = initializeApp(firebaseConfig);
    window.db = getFirestore(app);
    window.auth = getAuth(app);
    window.fbFunc = { doc, setDoc, collection, getDocs, query, where, createUserWithEmailAndPassword };
  </script>

  <style>
    :root { --hijau: #0a3622; --gold: #d4af37; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Segoe UI, sans-serif; background: linear-gradient(135deg, #0a3622 0%, #1a5c3a 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;}
    .box { background: white; width: min(500px, 100%); padding: 30px 24px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
    .box img { width: 70px; height: 70px; border-radius: 50%; border: 3px solid var(--gold); display: block; margin: 0 auto 10px; }
    .box h2 { text-align: center; color: var(--hijau); margin: 0 0 20px; }
    label { font-weight: bold; font-size: 13px; display: block; margin-bottom: 5px; }
    input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 10px; margin-bottom: 15px; box-sizing: border-box; }
    .btn { width: 100%; padding: 12px; background: #16a085; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 15px; }
    .btn:hover { background: #12876f; }
    .link-login { text-align: center; margin-top: 15px; font-size: 13px; }
    .link-login a { color: var(--hijau); font-weight: bold; text-decoration: none; }
    #msg { color: #e74c3c; text-align: center; font-size: 13px; font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="box">
    <img src="fotogroupxi-6.png" alt="logo" />
    <h2>Daftar Akun Siswa</h2>

    <label>Nama Lengkap</label>
    <input type="text" id="regNama" placeholder="Masukkan Nama Lengkap Anda" />
    
    <label>NIS (Nomor Induk Siswa)</label>
    <input type="text" id="regNis" placeholder="Masukkan NIS" />
    
    <label>Email Aktif</label>
    <input type="email" id="regEmail" placeholder="contoh@gmail.com" />
    
    <label>Password (Min. 6 Karakter)</label>
    <input type="password" id="regPass" placeholder="Buat Password" />

    <button class="btn" onclick="prosesDaftar()">📝 DAFTAR SEKARANG</button>
    <div id="msg"></div>

    <div class="link-login">
      Sudah punya akun? <a href="index.html">Login di sini</a>
    </div>
  </div>

  <script>
    async function prosesDaftar() {
      const nama = document.getElementById("regNama").value.trim();
      const nis = document.getElementById("regNis").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const pass = document.getElementById("regPass").value;
      const msg = document.getElementById("msg");

      if(!nama || !nis || !email || !pass) {
        msg.textContent = "❌ Semua data wajib diisi!";
        return;
      }

      msg.style.color = "#888";
      msg.textContent = "⏳ Memproses pendaftaran...";

      const { doc, setDoc, createUserWithEmailAndPassword, collection, getDocs, query, where } = window.fbFunc;
      const db = window.db;
      const auth = window.auth;

      try {
        // 1. Cek apakah NIS sudah terdaftar
        const qNis = query(collection(db, "AkunSiswa"), where("nis", "==", nis));
        const cekNis = await getDocs(qNis);
        if(!cekNis.empty) {
          msg.style.color = "#e74c3c";
          msg.textContent = "❌ NIS ini sudah terdaftar!";
          return;
        }

        // 2. Buat Akun Login Firebase Auth
        const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
        const uid = userCredential.user.uid;

        // 3. Simpan Profil ke Firestore (Koleksi "AkunSiswa")
        await setDoc(doc(db, "AkunSiswa", uid), {
          nama: nama,
          nis: nis,
          email: email,
          kelas: "XI-6", 
          role: "siswa"
        });

        msg.style.color = "#16a085";
        msg.textContent = "✅ Pendaftaran Berhasil! Mengalihkan ke Login...";
        
        setTimeout(() => {
          window.location.href = "index.html";
        }, 2000);

      } catch (error) {
        console.error(error);
        msg.style.color = "#e74c3c";
        if (error.code === 'auth/email-already-in-use') {
          msg.textContent = "❌ Email sudah digunakan. Gunakan email lain.";
        } else if (error.code === 'auth/weak-password') {
          msg.textContent = "❌ Password terlalu lemah (minimal 6 karakter).";
        } else {
          msg.textContent = "❌ Gagal mendaftar: " + error.message;
        }
      }
    }
  </script>
</body>
</html>
