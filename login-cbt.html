<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login CBT - SIPADAK</title>
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBZIzD2337cdCxhV2EdcDMK3iwnaR0GiS4",
      authDomain: "sipadak-xi6.firebaseapp.com",
      projectId: "sipadak-xi6",
      storageBucket: "sipadak-xi6.firebasestorage.app",
      messagingSenderId: "981787419124",
      appId: "1:981787419124:web:6622e4bd0b928e9bea19a1"
    };

    const app = initializeApp(firebaseConfig);
    window.db = getFirestore(app);
    window.fbFunc = { collection, getDocs };
    window.dispatchEvent(new Event('firebaseReady'));
  </script>

  <style>
    :root { --hijau: #0a3622; --gold: #d4af37; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, var(--hijau) 0%, #1a5c3a 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-box { background: white; width: min(400px, 90%); padding: 30px 24px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
    .login-box h2 { text-align: center; color: var(--hijau); margin: 0 0 5px; }
    .login-box p { text-align: center; font-size: 13px; color: #666; margin: 0 0 20px; }
    input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 10px; margin-bottom: 15px; box-sizing: border-box; }
    .btn-login { width: 100%; padding: 12px; background: var(--hijau); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
    #loginMessage { color: #e74c3c; text-align: center; font-size: 13px; font-weight: bold; margin-top: 10px; min-height: 18px; }
    
    /* STYLE UNTUK MENU PILIHAN UJIAN */
    .menu-ujian { display: none; text-align: center; }
    .menu-ujian h3 { color: var(--hijau); margin-bottom: 20px; }
    .btn-pilihan { display: block; width: 100%; padding: 15px; margin-bottom: 15px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; text-decoration: none; text-align: center; transition: 0.3s; }
    .btn-pre { background: #3498db; color: white; box-shadow: 0 4px 15px rgba(52, 152, 219, 0.4); }
    .btn-pre:hover { background: #2980b9; transform: translateY(-2px); }
    .btn-post { background: #e67e22; color: white; box-shadow: 0 4px 15px rgba(230, 126, 34, 0.4); }
    .btn-post:hover { background: #d35400; transform: translateY(-2px); }
    .btn-keluar { background: #e74c3c; color: white; box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4); }
    .btn-keluar:hover { background: #c0392b; transform: translateY(-2px); }
  </style>
</head>
<body>

  <div class="login-box">
    
    <!-- FORM LOGIN -->
    <div id="formLogin">
      <h2>Sistem CBT</h2>
      <p>Masukkan NIS dan Password untuk memulai ujian.</p>

      <label>NIS (Nomor Induk Siswa)</label>
      <input id="loginNis" type="text" placeholder="Masukkan NIS" />
      
      <label>Password</label>
      <input id="loginPass" type="password" placeholder="Password" />
      
      <button class="btn-login" onclick="prosesLogin()">🚀 MASUK</button>
      <div id="loginMessage"></div>

      <div style="text-align: center; margin-top: 20px;">
        <a href="index.html" style="color: #666; text-decoration: none; font-size: 13px; font-weight: bold;">⬅ Kembali ke Beranda</a>
      </div>
    </div>

    <!-- MENU PILIHAN UJIAN (Muncul Setelah Login) -->
    <div id="menuPilihan" class="menu-ujian">
      <h3>Pilih Jenis Ujian</h3>
      <p style="color: #666; font-size: 13px; margin-bottom: 20px;">Halo, <b id="namaSiswaPilihan"></b>!</p>
      
      <a href="ujian-cbt.html" class="btn-pilihan btn-pre">📝 Mulai Pre-Test</a>
      <a href="post-test-produsen.html" class="btn-pilihan btn-post">🎯 Mulai Post-Test</a>
      
      <button onclick="logoutCBT()" class="btn-pilihan btn-keluar" style="margin-top: 10px;">🚪 Keluar</button>
    </div>

  </div>

  <script>
    async function prosesLogin() {
      const nis = document.getElementById("loginNis").value.trim();
      const pass = document.getElementById("loginPass").value.trim();
      const pesan = document.getElementById("loginMessage");

      if (!nis || !pass) {
        pesan.textContent = "❌ NIS dan Password wajib diisi!";
        return;
      }

      pesan.textContent = "⏳ Memeriksa data...";

      try {
        const { collection, getDocs } = window.fbFunc;
        const db = window.db;

        let loginBerhasil = false;
        let dataSiswa = null;

        // 1. Cek di koleksi "Siswa" (Kelas XI-6)
        const snapSiswa = await getDocs(collection(db, "Siswa"));
        snapSiswa.forEach((doc) => {
          const data = doc.data();
          if(data.nis === nis) {
             if(pass === data.password || (data.password === undefined && pass === "123456")) { 
               loginBerhasil = true;
               dataSiswa = data;
             }
          }
        });

        // 2. Jika tidak ketemu, cek di koleksi "SiswaX7" (Kelas X-7)
        if (!loginBerhasil) {
          const snapX7 = await getDocs(collection(db, "SiswaX7"));
          snapX7.forEach((doc) => {
            const data = doc.data();
            const nisSiswa = data.nisn || data.nis;
            if(nisSiswa === nis) {
               if(pass === data.password || (data.password === undefined && pass === "123456")) { 
                 loginBerhasil = true;
                 dataSiswa = data;
               }
            }
          });
        }

        if (loginBerhasil && dataSiswa) {
          // Simpan sesi siswa
          localStorage.setItem("cbtNamaSiswa", dataSiswa.nama);
          localStorage.setItem("cbtNisSiswa", nis);
          
          // Sembunyikan Form Login, Tampilkan Menu Pilihan
          document.getElementById("formLogin").style.display = "none";
          document.getElementById("menuPilihan").style.display = "block";
          document.getElementById("namaSiswaPilihan").textContent = dataSiswa.nama;
          
          pesan.textContent = "";

        } else {
           pesan.textContent = "❌ NIS tidak ditemukan atau Password salah!";
        }
      } catch (error) {
        console.error(error);
        pesan.textContent = "❌ Gagal terhubung ke database.";
      }
    }

    // Fungsi Keluar dari Menu CBT
    function logoutCBT() {
      if(confirm("Yakin ingin keluar?")) {
        localStorage.removeItem("cbtNamaSiswa");
        localStorage.removeItem("cbtNisSiswa");
        window.location.reload(); // Refresh halaman kembali ke form login
      }
    }
  </script>
</body>
</html>
