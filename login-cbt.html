<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login CBT - SIPADAK XI-6</title>
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBZIzD2337cdCxhV2EdcDMK3iwnaR0GiS4",
      authDomain: "sipadak-xi6.firebaseapp.com",
      projectId: "sipadak-xi6",
      storageBucket: "sipadak-xi6.firebasestorage.app",
      messagingSenderId: "981787419124",
      appId: "1:981787419124:web:6622e4bd0b928e9bea19a1"
    };

    const app = initializeApp(firebaseConfig);
    window.db = getFirestore(app);
    window.fbFunc = { collection, getDocs };
    window.dispatchEvent(new Event('firebaseReady'));
  </script>

  <style>
    :root { --hijau: #0a3622; --gold: #d4af37; --bg: #f3f5f4; --text: #1e293b; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, var(--hijau) 0%, #1a5c3a 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-box { background: white; width: min(400px, 90%); padding: 30px 24px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
    .login-box h2 { text-align: center; color: var(--hijau); margin: 0 0 5px; }
    .login-box p { text-align: center; font-size: 13px; color: #666; margin: 0 0 20px; }
    input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 10px; margin-bottom: 15px; box-sizing: border-box; }
    .btn-login { width: 100%; padding: 12px; background: var(--hijau); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
    #loginMessage { color: #e74c3c; text-align: center; font-size: 13px; font-weight: bold; margin-top: 10px; height: 18px; }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>Sistem CBT</h2>
    <p>Masukkan NIS dan Password untuk memulai ujian.</p>

    <label>NIS (Nomor Induk Siswa)</label>
    <input id="loginNis" type="text" placeholder="Masukkan NIS" />
    
    <label>Password</label>
    <input id="loginPass" type="password" placeholder="Password" />
    
    <button class="btn-login" onclick="prosesLogin()">🚀 MULAI UJIAN</button>
    <div id="loginMessage"></div>
  </div>

  <script>
    async function prosesLogin() {
      const nis = document.getElementById("loginNis").value.trim();
      const pass = document.getElementById("loginPass").value.trim();
      const pesan = document.getElementById("loginMessage");

      if (!nis || !pass) {
        pesan.textContent = "❌ NIS dan Password wajib diisi!";
        return;
      }

      pesan.textContent = "⏳ Memeriksa data...";

      try {
        const { collection, getDocs } = window.fbFunc;
        const db = window.db;

        // Cari siswa berdasarkan NIS
        const querySnapshot = await getDocs(collection(db, "Siswa"));
        let loginBerhasil = false;
        let dataSiswa = null;

        querySnapshot.forEach((doc) => {
          const data = doc.data();
          if(data.nis === nis) {
             // Cek password (default 123456 atau password dari DB)
             if(pass === data.password || (data.password === undefined && pass === "123456")) { 
               loginBerhasil = true;
               dataSiswa = data;
             }
          }
        });

        if (loginBerhasil && dataSiswa) {
          // Simpan sesi siswa untuk ujian
          localStorage.setItem("cbtNamaSiswa", dataSiswa.nama);
          localStorage.setItem("cbtNisSiswa", dataSiswa.nis);
          window.location.href = "ujian-cbt.html"; 
        } else {
           pesan.textContent = "❌ NIS tidak ditemukan atau Password salah!";
        }
      } catch (error) {
        console.error(error);
        pesan.textContent = "❌ Gagal terhubung ke database.";
      }
    }
        // Jika siswa berhasil login, arahkan ke halaman ujian
    if (loginBerhasil && dataSiswa) {
      localStorage.setItem("cbtNamaSiswa", dataSiswa.nama);
      localStorage.setItem("cbtNisSiswa", nis);
      window.location.href = "ujian-cbt.html"; 
    }
  </script>
</body>
</html>
