<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Siswa - SIPADAK</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        h2 { color: #006400; text-align: center; }
        .info-row { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .label { font-weight: bold; color: #555; }
        .btn-logout { display: block; width: 100%; padding: 10px; background: #dc3545; color: white; border: none; border-radius: 5px; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Profil Siswa</h2>
        <div id="loading">Memuat data...</div>
        
        <div id="data-siswa" style="display: none;">
            <div class="info-row"><span class="label">Nama:</span> <span id="out-nama"></span></div>
            <div class="info-row"><span class="label">NIS:</span> <span id="out-nis"></span></div>
            <div class="info-row"><span class="label">Kelas:</span> <span id="out-kelas"></span></div>
            <div class="info-row"><span class="label">Email:</span> <span id="out-email"></span></div>
        </div>

        <button class="btn-logout" onclick="logout()">Logout / Keluar</button>
    </div>

    <script type="module">
        // IMPORT FIREBASE
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // KONFIGURASI FIREBASE (GANTI DENGAN PUNYA ANDA)
        const firebaseConfig = {
            apiKey: "AIzaSy...", // Sesuaikan
            authDomain: "sipadak-xi6.firebaseapp.com",
            projectId: "sipadak-xi6",
            // ... lengkapi
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // CEK SIAPA YANG SEDANG LOGIN
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // Jika ada yang login, cari datanya di koleksi "Siswa" berdasarkan email
                const q = query(collection(db, "Siswa"), where("email", "==", user.email));
                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {
                    // Data ditemukan, tampilkan
                    const dataSiswa = querySnapshot.docs[0].data();
                    
                    document.getElementById('out-nama').innerText = dataSiswa.nama;
                    document.getElementById('out-nis').innerText = dataSiswa.nis;
                    document.getElementById('out-kelas').innerText = dataSiswa.kelas;
                    document.getElementById('out-email').innerText = dataSiswa.email;

                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('data-siswa').style.display = 'block';
                } else {
                    document.getElementById('loading').innerText = "Data siswa tidak ditemukan di database.";
                }
            } else {
                // Jika tidak ada yang login, tendang ke halaman login
                window.location.href = "login.html";
            }
        });

        // FUNGSI LOGOUT
        window.logout = function() {
            signOut(auth).then(() => {
                window.location.href = "login.html";
            }).catch((error) => {
                console.error("Gagal logout:", error);
            });
        }
    </script>
</body>
</html>
