<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rekap Poin - SIPADAK XI-6</title>
  <style>
    :root { --hijau: #0a3622; --gold: #d4af37; --bg: #f3f5f4; --text: #1f2937; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Segoe UI, sans-serif; background: var(--bg); color: var(--text); }
    .header { background: var(--hijau); color: #f6e27a; display: flex; justify-content: space-between; padding: 15px 22px; border-bottom: 4px solid var(--gold); }
    .header h1 { margin: 0; font-size: 20px; }
    .container { max-width: 900px; margin: 20px auto; padding: 0 16px; }
    .card { background: white; border-radius: 14px; padding: 20px; box-shadow: 0 2px 9px rgba(0,0,0,0.07); }
    h3 { margin-top: 0; color: var(--hijau); }
    input { width: 100%; padding: 11px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; }
    .btn-back { background: var(--hijau); color: white; text-decoration: none; padding: 10px 15px; border-radius: 8px; font-size: 14px; font-weight: bold; display: inline-block; margin-bottom: 15px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { border: 1px solid #e5e7eb; padding: 10px; text-align: left; }
    th { background: #f5f5f5; }
    .badge { padding: 5px 10px; border-radius: 12px; color: white; font-size: 12px; font-weight: bold; }
    .Ringan { background: #2ecc71; }
    .Sedang { background: #f1c40f; color: #333; }
    .Berat { background: #e74c3c; }
    .SangatBerat { background: #000; }
  </style>
</head>
<body>
  <div class="header">
    <h1>📊 Rekap Poin Siswa</h1>
    <span>MAN 3 BOGOR</span>
  </div>

  <div class="container">
    <a href="dashboard-induk.html" class="btn-back...">⬅ Kembali ke Dashboard</a>

    <div class="card">
      <h3>Akumulasi Poin Pelanggaran</h3>
      <input type="text" id="cariSiswa" placeholder="Cari nama siswa..." onkeyup="tampilRekap()">
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr><th>No</th><th>Nama Siswa</th><th>Kelas</th><th>Jml Pelanggaran</th><th>Total Poin</th><th>Kategori</th></tr>
          </thead>
          <tbody id="rekapSiswa"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    if(localStorage.getItem("siTatibLogin") !== "true") window.location.href = "index.html";
    
    let db = [];

    window.onload = function() {
      db = JSON.parse(localStorage.getItem("siTatibData") || "[]");
      tampilRekap();
    };

    function tampilRekap() {
      const keyword = document.getElementById("cariSiswa").value.toLowerCase();
      const tbody = document.getElementById("rekapSiswa");
      tbody.innerHTML = "";

      const rekap = {};
      db.forEach(row => {
        const nama = (row.nama || "").trim();
        if (!nama) return;
        if (!rekap[nama]) rekap[nama] = { nama, kelas: row.kelas || "", jumlah: 0, total: 0 };
        rekap[nama].jumlah += 1;
        rekap[nama].total += parseInt(row.total) || 0;
      });

      let list = Object.values(rekap);
      if (keyword) list = list.filter(s => s.nama.toLowerCase().includes(keyword));
      list.sort((a, b) => b.total - a.total);

      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#888;">Belum ada data pelanggaran.</td></tr>';
        return;
      }

      list.forEach((s, i) => {
        let kategori = "Ringan", badgeClass = "Ringan";
        if (s.total >= 75) { kategori = "Sangat Berat"; badgeClass = "SangatBerat"; }
        else if (s.total >= 50) { kategori = "Berat"; badgeClass = "Berat"; }
        else if (s.total >= 25) { kategori = "Sedang"; badgeClass = "Sedang"; }

        tbody.innerHTML += `
          <tr>
            <td style="text-align:center;font-weight:bold">${i + 1}</td>
            <td><strong>${s.nama}</strong></td>
            <td style="text-align:center">${s.kelas}</td>
            <td style="text-align:center"><strong>${s.jumlah}x</strong></td>
            <td style="text-align:center"><strong>${s.total}</strong></td>
            <td style="text-align:center"><span class="badge ${badgeClass}">${kategori}</span></td>
          </tr>
        `;
      });
    }
  </script>
</body>
</html>
