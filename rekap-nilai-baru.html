<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rekap Nilai XI-6 - SIPADAK</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f3f5f4; margin: 0; padding: 20px; }
    .card { background: white; border-radius: 14px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 1000px; margin: 0 auto; }
    h2 { color: #0a3622; text-align: center; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 20px; }
    th, td { border: 1px solid #e5e7eb; padding: 12px; text-align: left; }
    th { background: #0a3622; color: white; text-align: center; }
    .btn-back { display: inline-block; background: #e2e8f0; color: #333; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-bottom: 20px; }
    body.di-dalam-iframe .btn-back { display: none; }
    .skor-tinggi { color: #27ae60; font-weight: bold; }
    .skor-rendah { color: #e74c3c; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <a href="profil-siswa.html" class="btn-back">⬅ Kembali ke Profil</a>
    <h2>📊 Rekap Nilai Pre-Test & Post-Test XI-6</h2>
    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th>No</th>
            <th>Nama Siswa</th>
            <th>Jenis Ujian</th>
            <th>Tanggal</th>
            <th>Skor</th>
            <th>Nilai Akhir</th>
          </tr>
        </thead>
        <tbody id="listNilai">
          <tr><td colspan="6" style="text-align:center; padding: 20px;">Memuat data...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    if (window.self !== window.top) {
      document.body.classList.add('di-dalam-iframe');
    }

    window.onload = function() {
      const tbody = document.getElementById("listNilai");
      
      // KITA MENGGUNAKAN FUNGSI FETCH (CARA PALING DASAR DI BROWSER)
      fetch("https://firestore.googleapis.com/v1/projects/sipadak-xi6/databases/(default)/documents/HasilUjianXI6")
        .then(response => response.json())
        .then(data => {
          if (!data.documents) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 20px;">Belum ada data nilai di database.</td></tr>';
            return;
          }

          let dataUjian = [];
          data.documents.forEach(doc => {
            const fields = doc.fields;
            if (fields && fields.nama) {
              dataUjian.push({
                nama: fields.nama.stringValue,
                jenis: fields.jenisUjian ? fields.jenisUjian.stringValue : "Pre-Test",
                tanggal: fields.tanggal ? fields.tanggal.stringValue : "-",
                skor: fields.skor ? fields.skor.integerValue : 0,
                totalSoal: fields.totalSoal ? fields.totalSoal.integerValue : 0,
                persentase: fields.persentase ? fields.persentase.integerValue : 0
              });
            }
          });

          if (dataUjian.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 20px;">Data kosong.</td></tr>';
            return;
          }

          // Urutkan dari yang terbaru
          dataUjian.sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));

          let html = "";
          let no = 1;
          dataUjian.forEach(d => {
            const kelasSkor = d.persentase >= 70 ? "skor-tinggi" : "skor-rendah";
            html += `
              <tr>
                <td style="text-align:center;">${no++}</td>
                <td><b>${d.nama}</b></td>
                <td style="text-align:center;">${d.jenis}</td>
                <td style="text-align:center;">${d.tanggal}</td>
                <td style="text-align:center;">${d.skor} / ${d.totalSoal}</td>
                <td class="${kelasSkor}" style="text-align:center;">${d.persentase}</td>
              </tr>
            `;
          });
          tbody.innerHTML = html;
        })
        .catch(error => {
          console.error("Error:", error);
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:red; padding: 20px;">Gagal memuat data. Periksa koneksi internet Anda.</td></tr>';
        });
    };
  </script>
</body>
</html>
