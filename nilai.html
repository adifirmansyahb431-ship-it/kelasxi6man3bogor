<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Database Nilai - SI-TATIB</title>
  <style>
    :root { --hijau: #0a3622; --gold: #d4af37; --bg: #f3f5f4; --text: #1f2937; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Segoe UI, sans-serif; background: var(--bg); color: var(--text); }
    .header { background: var(--hijau); color: #f6e27a; display: flex; justify-content: space-between; padding: 15px 22px; border-bottom: 4px solid var(--gold); }
    .header h1 { margin: 0; font-size: 20px; }
    .container { max-width: 100%; padding: 20px; }
    .card { background: white; border-radius: 14px; padding: 20px; box-shadow: 0 2px 9px rgba(0,0,0,0.07); overflow: hidden; }
    h3 { margin-top: 0; color: var(--hijau); }
    
    .btn-back { background: var(--hijau); color: white; text-decoration: none; padding: 10px 15px; border-radius: 8px; font-size: 14px; font-weight: bold; display: inline-block; margin-bottom: 15px; }
    .btn-save { background: #16a085; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-bottom: 15px; width: 100%;}
    .btn-save:hover { background: #12876f; }

    /* Tampilan Tabel Excel */
    .table-responsive { width: 100%; overflow-x: auto; border: 1px solid #ccc; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    th { background: #e2e8f0; font-weight: bold; position: sticky; top: 0; z-index: 10; }
    
    /* Warna kolom tetap (Sticky Column) untuk Nama Siswa */
    .sticky-col { position: sticky; left: 0; background: #f8fafc; z-index: 5; text-align: left; border-right: 2px solid #cbd5e1; }
    th.sticky-col { z-index: 15; background: #cbd5e1; }

    /* Input nilai di dalam tabel */
    input.nilai-input { width: 60px; padding: 6px; border: 1px solid transparent; border-radius: 4px; text-align: center; font-size: 13px; background: transparent; }
    input.nilai-input:focus { border-color: #16a085; background: white; outline: none; box-shadow: 0 0 5px rgba(22, 160, 133, 0.3); }
    input.nilai-input::-webkit-outer-spin-button, input.nilai-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    
    /* Tombol Download */
    .btn-download { background: #2471a3; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; float: right; margin-bottom: 10px;}
  </style>
  <!-- Library untuk Download Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div class="header">
    <h1>⭐ Database Nilai Siswa</h1>
    <span>MAN 3 BOGOR</span>
  </div>

  <div class="container">
    <a href="index.html" class="btn-back">⬅ Kembali ke Dashboard</a>
    <button class="btn-download" onclick="downloadExcel()">⬇️ Download Database (Excel)</button>

    <div class="card">
      <h3>Input Nilai (Format Tabel)</h3>
      <p style="font-size:13px; color:#666; margin-bottom:15px;">Ketik nilai langsung di dalam kotak tabel. Geser tabel ke kanan/kiri untuk melihat semua mata pelajaran.</p>
      
      <button class="btn-save" onclick="simpanSemuaNilai()">💾 SIMPAN SEMUA NILAI</button>

      <div class="table-responsive">
        <table id="tabelNilai">
          <thead>
            <tr>
              <th style="width:40px;">No</th>
              <th class="sticky-col" style="width:250px;">Nama Siswa</th>
              <th>NIS</th>
              <!-- Kolom Mapel akan digenerate oleh JS -->
            </tr>
          </thead>
          <tbody id="tbodyNilai">
            <!-- Baris Siswa akan digenerate oleh JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    if(localStorage.getItem("siTatibLogin") !== "true") window.location.href = "index.html";
    
    // Daftar Mata Pelajaran (Sesuai Excel)
    const MAPEL = [
      "Al-Qur'an Hadis", "Aqidah Akhlak", "Fiqih", "Sejarah Kebudayaan Islam", 
      "Bahasa Arab", "Pendidikan Pancasila", "Bahasa Indonesia", "Matematika", 
      "Bahasa Inggris", "PJOK", "Sejarah", "Seni Budaya", "Bahasa Sunda"
    ];

    // Kunci penyimpanan LocalStorage
    const NILAI_KEY = "siTatibNilaiMatriks";
    let dataNilai = {}; // Format: { "NAMA SISWA": { "Matematika": 80, "PJOK": 90 } }

    window.onload = function() {
      // 1. Muat data nilai lama
      dataNilai = JSON.parse(localStorage.getItem(NILAI_KEY) || "{}");
      
      // 2. Muat daftar siswa
      let listSiswa = JSON.parse(localStorage.getItem('siTatibSiswa') || "[]");
      
      // Jika data siswa kosong, gunakan data fallback (bawaan)
      if (listSiswa.length === 0) {
        listSiswa = ["ADINDA RIZKY AYU PUTRI", "AHMAD FAQIH ALFAIQ", "AIA TRINIYULIYANTI"]; 
      }

      renderTabel(listSiswa);
    };

    function renderTabel(listSiswa) {
      // 1. Buat Header Kolom Mapel
      const theadTr = document.querySelector("#tabelNilai thead tr");
      MAPEL.forEach(mapel => {
        const th = document.createElement("th");
        th.textContent = mapel;
        theadTr.appendChild(th);
      });

      // 2. Buat Baris Siswa
      const tbody = document.getElementById("tbodyNilai");
      tbody.innerHTML = "";

      listSiswa.forEach((siswa, index) => {
        const tr = document.createElement("tr");
        
        // Kolom No
        let tdNo = document.createElement("td");
        tdNo.textContent = index + 1;
        tr.appendChild(tdNo);

        // Kolom Nama (Sticky)
        let tdNama = document.createElement("td");
        tdNama.className = "sticky-col";
        tdNama.innerHTML = `<b>${siswa}</b>`;
        tr.appendChild(tdNama);

        // Kolom NIS (Dikosongkan sementara atau ambil dari database siswa jika ada)
        let tdNis = document.createElement("td");
        tdNis.textContent = "-"; 
        tr.appendChild(tdNis);

        // Kolom Nilai per Mapel
        MAPEL.forEach(mapel => {
          let tdNilai = document.createElement("td");
          
          // Ambil nilai jika sudah pernah disimpan
          let nilaiTersimpan = "";
          if (dataNilai[siswa] && dataNilai[siswa][mapel]) {
            nilaiTersimpan = dataNilai[siswa][mapel];
          }

          tdNilai.innerHTML = `
            <input type="number" class="nilai-input" 
                   data-siswa="${siswa}" 
                   data-mapel="${mapel}" 
                   value="${nilaiTersimpan}" 
                   min="0" max="100" placeholder="-">
          `;
          tr.appendChild(tdNilai);
        });

        tbody.appendChild(tr);
      });
    }

    function simpanSemuaNilai() {
      const inputs = document.querySelectorAll('.nilai-input');
      let jumlahDiisi = 0;

      inputs.forEach(input => {
        const siswa = input.getAttribute('data-siswa');
        const mapel = input.getAttribute('data-mapel');
        const val = input.value;

        if (!dataNilai[siswa]) {
          dataNilai[siswa] = {};
        }

        if (val !== "") {
          dataNilai[siswa][mapel] = Number(val);
          jumlahDiisi++;
        } else {
          delete dataNilai[siswa][mapel]; // Hapus jika dikosongkan
        }
      });

      // Simpan ke browser
      localStorage.setItem(NILAI_KEY, JSON.stringify(dataNilai));
      alert(`✅ Berhasil menyimpan ${jumlahDiisi} data nilai!`);
    }

    function downloadExcel() {
      // 1. Siapkan Header
      const headers = ["No", "Nama Siswa", "NIS", ...MAPEL];
      const wsData = [headers];

      // 2. Ambil Data dari LocalStorage
      const dataTersimpan = JSON.parse(localStorage.getItem(NILAI_KEY) || "{}");
      const listSiswa = JSON.parse(localStorage.getItem('siTatibSiswa') || "[]");
      const finalSiswa = listSiswa.length > 0 ? listSiswa : ["ADINDA RIZKY AYU PUTRI"];

      // 3. Susun Baris
      finalSiswa.forEach((siswa, index) => {
        const row = [index + 1, siswa, "-"]; // No, Nama, NIS
        MAPEL.forEach(mapel => {
          let nilai = "";
          if(dataTersimpan[siswa] && dataTersimpan[siswa][mapel]) {
            nilai = dataTersimpan[siswa][mapel];
          }
          row.push(nilai);
        });
        wsData.push(row);
      });

      // 4. Buat File Excel & Unduh
      const ws = XLSX.utils.aoa_to_sheet(wsData);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Database Nilai");
      XLSX.writeFile(wb, "Database_Nilai_XI-6.xlsx");
    }
  </script>
</body>
</html>
