<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Database Nilai - SIPADAK XI -6</title>
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBZIzD2337cdCxhV2EdcDMK3iwnaR0GiS4",
      authDomain: "sipadak-xi6.firebaseapp.com",
      projectId: "sipadak-xi6",
      storageBucket: "sipadak-xi6.firebasestorage.app",
      messagingSenderId: "981787419124",
      appId: "1:981787419124:web:6622e4bd0b928e9bea19a1"
    };

    const app = initializeApp(firebaseConfig);
    window.db = getFirestore(app);
    window.fbFunc = { collection, addDoc, getDocs, query, where, serverTimestamp };
    window.dispatchEvent(new Event('firebaseReady'));
  </script>

  <style>
    :root { --hijau: #0a3622; --gold: #d4af37; --bg: #f3f5f4; --text: #1f2937; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Segoe UI, sans-serif; background: var(--bg); color: var(--text); }
    .header { background: var(--hijau); color: #f6e27a; display: flex; justify-content: space-between; padding: 15px 22px; border-bottom: 4px solid var(--gold); }
    .header h1 { margin: 0; font-size: 20px; }
    .container { max-width: 100%; padding: 20px; }
    .card { background: white; border-radius: 14px; padding: 20px; box-shadow: 0 2px 9px rgba(0,0,0,0.07); overflow: hidden; }
    h3 { margin-top: 0; color: var(--hijau); }
    
    .btn-back { background: var(--hijau); color: white; text-decoration: none; padding: 10px 15px; border-radius: 8px; font-size: 14px; font-weight: bold; display: inline-block; margin-bottom: 15px; }
    
    /* NAVIGASI TAB */
    .tabs { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
    .tab-btn { background: #eee; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; color: #666; transition: 0.2s; }
    .tab-btn:hover { background: #ddd; }
    .tab-btn.active { background: var(--hijau); color: white; }

    .action-bar { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .btn-save { background: #16a085; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; flex: 1; }
    .btn-upload { background: #e67e22; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; flex: 1; text-align: center; }
    .btn-download { background: #2471a3; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; flex: 1; }

    /* Tampilan Tabel Excel */
    .table-responsive { width: 100%; overflow-x: auto; border: 1px solid #ccc; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    th { background: #e2e8f0; font-weight: bold; position: sticky; top: 0; z-index: 10; }
    
    /* Warna kolom tetap (Sticky Column) untuk Nama Siswa */
    .sticky-col { position: sticky; left: 0; background: #f8fafc; z-index: 5; text-align: left; border-right: 2px solid #cbd5e1; }
    th.sticky-col { z-index: 15; background: #cbd5e1; }

    /* Input nilai di dalam tabel */
    input.nilai-input { width: 60px; padding: 6px; border: 1px solid transparent; border-radius: 4px; text-align: center; font-size: 13px; background: transparent; }
    input.nilai-input:focus { border-color: #16a085; background: white; outline: none; box-shadow: 0 0 5px rgba(22, 160, 133, 0.3); }
    input.nilai-input::-webkit-outer-spin-button, input.nilai-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  </style>
  <!-- Library Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div class="header">
    <h1>⭐ Database Nilai Siswa</h1>
    <span id="roleUser">MAN 3 BOGOR</span>
  </div>

  <div class="container">
    <a href="dashboard-induk.html" class="btn-back">⬅ Kembali ke Dashboard</a>

    <div class="card">
      <h3 id="judulHalaman">Input Nilai - ASTS</h3>
      
      <!-- TOMBOL NAVIGASI TAB -->
      <div class="tabs">
        <button class="tab-btn active" onclick="gantiTab('ASTS', this)">ASTS</button>
        <button class="tab-btn" onclick="gantiTab('ASAS', this)">ASAS</button>
        <button class="tab-btn" onclick="gantiTab('Ulangan 1', this)">Ulangan 1</button>
        <button class="tab-btn" onclick="gantiTab('Ulangan 2', this)">Ulangan 2</button>
        <button class="tab-btn" onclick="gantiTab('Ulangan 3', this)">Ulangan 3</button>
        <button class="tab-btn" onclick="gantiTab('Tugas', this)">Tugas</button>
      </div>

      <!-- Tombol Aksi -->
      <div class="action-bar">
        <label class="btn-upload">
          📥 Upload dari Excel
          <input type="file" id="uploadExcel" accept=".xlsx,.xls" style="display: none;" onchange="importDariExcel(event)">
        </label>
        <button class="btn-save" onclick="simpanSemuaNilai()">💾 SIMPAN KE WEB</button>
        <button class="btn-download" onclick="downloadExcel()">⬇️ Download Excel</button>
      </div>
      
      <p style="font-size:13px; color:#666; margin-bottom:15px;">Ketik nilai langsung di dalam kotak tabel, atau upload file Excel yang sudah diisi. Pastikan Anda memilih Tab yang benar sebelum menyimpan.</p>

      <div class="table-responsive">
        <table id="tabelNilai">
          <thead>
            <tr>
              <th style="width:40px;">No</th>
              <th class="sticky-col" style="width:250px;">Nama Siswa</th>
              <!-- Kolom Mapel akan digenerate oleh JS -->
            </tr>
          </thead>
          <tbody id="tbodyNilai">
            <!-- Baris Siswa akan digenerate oleh JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    if(localStorage.getItem("siTatibLogin") !== "true") window.location.href = "index.html";
    document.getElementById("roleUser").textContent = localStorage.getItem("siTatibNama") || "Guru";

    const MAPEL = [
      "Al-Qur'an Hadis", "Aqidah Akhlak", "Fiqih", "Sejarah Kebudayaan Islam", 
      "Bahasa Arab", "Pendidikan Pancasila", "Bahasa Indonesia", "Matematika", 
      "Bahasa Inggris", "Penjas & Orkes (PJOK)", "Sejarah", "Seni Budaya", "Bahasa Sunda",
      "Sosiologi", "Ekonomi", "Geografi", "Sejarah Tingkat Lanjut"
    ];

    const NILAI_KEY = "siTatibNilaiMatriks_v2"; 
    let jenisAktif = "ASTS";
    // Format dataNilai: { "ASTS": { "Nama Siswa": { "Mapel": 90 } }, "ASAS": { ... } }
    let dataNilai = {}; 

    window.onload = function() {
      dataNilai = JSON.parse(localStorage.getItem(NILAI_KEY) || '{"ASTS":{},"ASAS":{},"Ulangan 1":{},"Ulangan 2":{},"Ulangan 3":{},"Tugas":{}}');
      
      let listSiswa = JSON.parse(localStorage.getItem('siTatibSiswa') || "[]");
      if (listSiswa.length === 0) {
        listSiswa = ["ADINDA RIZKY AYU PUTRI", "AHMAD FAQIH ALFAIQ", "AIA TRINIYULIYANTI"]; 
      }
      renderTabel(listSiswa);
    };

    function gantiTab(jenis, btnElement) {
      jenisAktif = jenis;
      document.getElementById("judulHalaman").textContent = `Input Nilai - ${jenis}`;
      
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');

      // Render ulang tabel untuk menampilkan data sesuai tab
      let listSiswa = JSON.parse(localStorage.getItem('siTatibSiswa') || "[]");
      if (listSiswa.length === 0) listSiswa = ["ADINDA RIZKY AYU PUTRI", "AHMAD FAQIH ALFAIQ", "AIA TRINIYULIYANTI"];
      renderTabel(listSiswa);
    }

    function renderTabel(listSiswa) {
      const theadTr = document.querySelector("#tabelNilai thead tr");
      theadTr.innerHTML = `<th style="width:40px;">No</th><th class="sticky-col" style="width:250px;">Nama Siswa</th>`;
      MAPEL.forEach(mapel => theadTr.innerHTML += `<th>${mapel}</th>`);

      const tbody = document.getElementById("tbodyNilai");
      tbody.innerHTML = "";

      // Ambil data sesuai tab yang aktif
      const dataTabAktif = dataNilai[jenisAktif] || {};

      listSiswa.forEach((siswa, index) => {
        let html = `<tr>
          <td>${index + 1}</td>
          <td class="sticky-col"><b>${siswa}</b></td>
        `;

        MAPEL.forEach(mapel => {
          let val = (dataTabAktif[siswa] && dataTabAktif[siswa][mapel]) ? dataTabAktif[siswa][mapel] : "";
          html += `<td><input type="number" class="nilai-input" data-siswa="${siswa}" data-mapel="${mapel}" value="${val}" min="0" max="100" placeholder="-"></td>`;
        });
        
        html += `</tr>`;
        tbody.innerHTML += html;
      });
    }

    async function simpanSemuaNilai() {
      if (!window.fbFunc) {
        alert("Koneksi ke database belum siap. Tunggu sebentar.");
        return;
      }
      
      const btn = document.querySelector('.btn-save');
      btn.textContent = "⏳ Menyimpan ke Database...";
      btn.disabled = true;

      const { collection, addDoc } = window.fbFunc;
      const db = window.db;

      const inputs = document.querySelectorAll('.nilai-input');
      
      if (!dataNilai[jenisAktif]) dataNilai[jenisAktif] = {};
      let dataSiswaMapel = {}; // Kumpulkan data per siswa

      inputs.forEach(input => {
        const siswa = input.getAttribute('data-siswa');
        const mapel = input.getAttribute('data-mapel');
        const val = input.value;

        if (!dataSiswaMapel[siswa]) dataSiswaMapel[siswa] = {};

        if (val !== "") {
          dataSiswaMapel[siswa][mapel] = Number(val);
        }
      });

      try {
        let promises = [];
        // Simpan ke Firebase (Satu dokumen per siswa per jenis penilaian)
        for (const siswa in dataSiswaMapel) {
          const docRef = collection(db, "Nilai");
          // Kita gunakan format: nama_siswa + "_" + jenisAktif agar mudah difilter nanti
          promises.push(addDoc(docRef, {
            nama: siswa,
            jenis: jenisAktif,
            nilai_mapel: dataSiswaMapel[siswa],
            timestamp: new Date()
          }));
        }

        await Promise.all(promises);

        // Simpan ke LocalStorage sebagai cadangan
        dataNilai[jenisAktif] = dataSiswaMapel;
        localStorage.setItem(NILAI_KEY, JSON.stringify(dataNilai));

        alert(`✅ Berhasil menyimpan nilai ${jenisAktif} ke Database!`);

      } catch (error) {
        console.error(error);
        alert("❌ Gagal menyimpan ke database: " + error.message);
      } finally {
        btn.textContent = "💾 SIMPAN KE WEB";
        btn.disabled = false;
      }
    }

    // ==================== UPLOAD DARI EXCEL ====================
    function importDariExcel(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          let sheetName = "Database";
          if (!workbook.Sheets[sheetName]) sheetName = workbook.SheetNames[0];
          
          const worksheet = workbook.Sheets[sheetName];
          const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

          let headerRowIdx = -1;
          let idxNama = -1;

          for (let i = 0; i < json.length; i++) {
            const rowStr = json[i].map(c => String(c).toUpperCase().trim());
            if (rowStr.includes("NAMA") && rowStr.includes("NIS")) {
              headerRowIdx = i;
              idxNama = rowStr.indexOf("NAMA");
              break;
            }
          }

          if (headerRowIdx === -1) {
            alert("❌ Tidak dapat menemukan baris judul (Header Nama dan NIS) di file Excel.");
            return;
          }

          const startIdxMapel = idxNama + 3; 
          let jumlahImport = 0;
          
          if (!dataNilai[jenisAktif]) dataNilai[jenisAktif] = {};

          for (let i = headerRowIdx + 1; i < json.length; i++) {
            const row = json[i];
            const nama = row[idxNama];
            if (!nama || String(nama).trim() === "" || String(nama).includes("=")) continue; 
            
            const namaSiswa = String(nama).trim().toUpperCase();
            if (!dataNilai[jenisAktif][namaSiswa]) dataNilai[jenisAktif][namaSiswa] = {};

            for (let m = 0; m < MAPEL.length; m++) {
              const colIdx = startIdxMapel + m;
              const val = row[colIdx];
              if (val !== undefined && val !== null && val !== "") {
                const numVal = Number(val);
                if (!isNaN(numVal)) {
                  dataNilai[jenisAktif][namaSiswa][MAPEL[m]] = numVal;
                  jumlahImport++;
                }
              }
            }
          }

          localStorage.setItem(NILAI_KEY, JSON.stringify(dataNilai));
          alert(`✅ Berhasil mengimpor ${jumlahImport} nilai untuk ${jenisAktif} dari Excel!`);
          gantiTab(jenisAktif, document.querySelector('.tab-btn.active')); // Refresh tabel

        } catch (err) {
          console.error(err);
          alert("❌ Gagal membaca file Excel: " + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
    }

    // ==================== DOWNLOAD KE EXCEL ====================
    function downloadExcel() {
      const headers = ["No", "Nama Siswa", ...MAPEL];
      const wsData = [headers];

      const dataTabAktif = dataNilai[jenisAktif] || {};
      const listSiswa = JSON.parse(localStorage.getItem('siTatibSiswa') || "[]");
      const finalSiswa = listSiswa.length > 0 ? listSiswa : ["ADINDA RIZKY AYU PUTRI"];

      finalSiswa.forEach((siswa, index) => {
        const row = [index + 1, siswa]; 
        MAPEL.forEach(mapel => {
          let nilai = (dataTabAktif[siswa] && dataTabAktif[siswa][mapel]) ? dataTabAktif[siswa][mapel] : "";
          row.push(nilai);
        });
        wsData.push(row);
      });

      const ws = XLSX.utils.aoa_to_sheet(wsData);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Database Nilai");
      XLSX.writeFile(wb, `Database_Nilai_${jenisAktif}_XI-6.xlsx`);
    }
  </script>
</body>
</html>
