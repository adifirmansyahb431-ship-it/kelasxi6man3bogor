<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Absensi Kelas X-7 - SIPADAK</title>
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, query, where, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBZIzD2337cdCxhV2EdcDMK3iwnaR0GiS4",
      authDomain: "sipadak-xi6.firebaseapp.com",
      projectId: "sipadak-xi6",
      storageBucket: "sipadak-xi6.firebasestorage.app",
      messagingSenderId: "981787419124",
      appId: "1:981787419124:web:6622e4bd0b928e9bea19a1"
    };

    const app = initializeApp(firebaseConfig);
    window.db = getFirestore(app);
    window.fbFunc = { collection, getDocs, addDoc, query, where, doc, setDoc };
    window.dispatchEvent(new Event('firebaseReady'));
  </script>

  <style>
    :root { --hijau: #0a3622; --gold: #d4af37; --bg: #f3f5f4; --text: #1f2937; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
    .header { background: var(--hijau); color: #f6e27a; display: flex; justify-content: space-between; align-items: center; padding: 15px 22px; border-bottom: 4px solid var(--gold); }
    .header h1 { margin: 0; font-size: 20px; }
    .container { max-width: 1000px; margin: 20px auto; padding: 0 16px; }
    .card { background: white; border-radius: 14px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 9px rgba(0,0,0,0.07); }
    
    .top-action { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
    input[type="date"] { padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-weight: bold; }
    .btn { border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; }
    .btn-save { background: #16a085; }
    .btn-tambah { background: #2980b9; margin-left: auto; }

    /* Tabel Absensi */
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { border: 1px solid #e5e7eb; padding: 10px; text-align: left; vertical-align: middle; }
    th { background: #f8fafc; text-align: center; }
    
    .status-select { padding: 8px; border-radius: 6px; font-weight: bold; border: 1px solid #ccc; width: 120px; cursor: pointer; }
    .status-select.Hadir { background: #e8f8f5; color: #1abc9c; }
    .status-select.Sakit { background: #fef9e7; color: #f1c40f; }
    .status-select.Izin { background: #ebf5fb; color: #3498db; }
    .status-select.Alpa { background: #fdedec; color: #e74c3c; }
    
    .btn-back { background: var(--hijau); color: white; text-decoration: none; padding: 10px 15px; border-radius: 8px; font-size: 14px; font-weight: bold; display: inline-block; margin-bottom: 15px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>📋 Absensi Kelas X-7</h1>
    <span id="roleUser">Memuat...</span>
  </div>

  <div class="container">
    <a href="javascript:void(0)" onclick="kembali()" class="btn-back">⬅ Kembali ke Dashboard</a>

    <div class="card">
      <div class="top-action">
        <label><b>Tanggal:</b></label>
        <input type="date" id="absensiTanggal" onchange="muatDataAbsensi()">
        
        <button class="btn btn-tambah" onclick="tambahSiswa()">➕ Tambah Siswa X-7</button>
        <button class="btn btn-save" onclick="simpanAbsensi()">💾 SIMPAN</button>
      </div>

      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th style="width: 40px;">No</th>
              <th>Nama Siswa</th>
              <th style="width: 150px;">Status</th>
              <th style="width: 200px;">Keterangan</th>
            </tr>
          </thead>
          <tbody id="listAbsensi">
            <tr><td colspan="4" style="text-align:center;">Belum ada data siswa. Silakan klik "Tambah Siswa X-7" atau upload via Excel (jika ada).</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    if(localStorage.getItem("siTatibLogin") !== "true") window.location.href = "index.html";
    document.getElementById("roleUser").textContent = localStorage.getItem("siTatibNama") || "Guru";

    let listSiswaX7 = [];
    let dataAbsensiHariIni = {};

    // Fungsi Kembali
    function kembali() {
      if (window.parent && window.parent.tutupHalaman) {
        window.parent.tutupHalaman();
      } else {
        window.location.href = "dashboard-induk.html";
      }
    }

    // Fungsi Tambah Siswa Manual (Sementara)
    async function tambahSiswa() {
      const nama = prompt("Masukkan Nama Siswa X-7:");
      if (!nama) return;

      const { collection, addDoc } = window.fbFunc;
      const db = window.db;

      try {
        await addDoc(collection(db, "SiswaX7"), {
          nama: nama,
          kelas: "X-7",
          nis: "-" // Bisa diubah nanti
        });
        alert("Siswa berhasil ditambahkan!");
        muatDataAbsensi();
      } catch (error) {
        console.error(error);
        alert("Gagal menambah siswa.");
      }
    }

    // Muat Data Absensi
    window.addEventListener('firebaseReady', () => {
      document.getElementById('absensiTanggal').valueAsDate = new Date();
      muatDataAbsensi();
    });

    async function muatDataAbsensi() {
      const tgl = document.getElementById('absensiTanggal').value;
      if(!tgl) return;

      const { collection, getDocs, query, where } = window.fbFunc;
      const db = window.db;
      const tbody = document.getElementById("listAbsensi");

      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Memuat data...</td></tr>';

      try {
        // 1. Ambil data siswa X-7
        const snapSiswa = await getDocs(collection(db, "SiswaX7"));
        listSiswaX7 = [];
        snapSiswa.forEach(doc => listSiswaX7.push(doc.data().nama));

        if (listSiswaX7.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Belum ada data siswa X-7. Silakan klik "Tambah Siswa X-7".</td></tr>';
          return;
        }

        // 2. Ambil data absensi hari ini
        dataAbsensiHariIni = {};
        const q = query(collection(db, "AbsensiX7"), where("tanggal", "==", tgl));
        const snapAbsensi = await getDocs(q);
        snapAbsensi.forEach(doc => {
          dataAbsensiHariIni[doc.data().nama] = doc.data();
        });

        // 3. Render Tabel
        tbody.innerHTML = "";
        listSiswaX7.forEach((nama, index) => {
          const record = dataAbsensiHariIni[nama] || { status: "Hadir", keterangan: "" };
          
          tbody.innerHTML += `
            <tr>
              <td style="text-align:center;">${index + 1}</td>
              <td><b>${nama}</b></td>
              <td>
                <select class="status-select ${record.status}" onchange="ubahWarna(this)">
                  <option value="Hadir" ${record.status === 'Hadir' ? 'selected' : ''}>Hadir</option>
                  <option value="Sakit" ${record.status === 'Sakit' ? 'selected' : ''}>Sakit</option>
                  <option value="Izin" ${record.status === 'Izin' ? 'selected' : ''}>Izin</option>
                  <option value="Alpa" ${record.status === 'Alpa' ? 'selected' : ''}>Alpa</option>
                </select>
              </td>
              <td><input type="text" class="input-ket" value="${record.keterangan || ''}" placeholder="-" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:6px;"></td>
            </tr>
          `;
        });

      } catch (error) {
        console.error(error);
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:red;">Gagal memuat data.</td></tr>';
      }
    }

    function ubahWarna(select) {
      select.className = "status-select " + select.value;
    }

    // Simpan Absensi
    async function simpanAbsensi() {
      const tgl = document.getElementById('absensiTanggal').value;
      const rows = document.querySelectorAll('#listAbsensi tr');
      
      if (rows.length === 0 || listSiswaX7.length === 0) return alert("Tidak ada data untuk disimpan.");

      const btn = document.querySelector('.btn-save');
      btn.textContent = "⏳ Menyimpan...";
      btn.disabled = true;

      const { doc, setDoc } = window.fbFunc;
      const db = window.db;
      
      let promises = [];

      try {
        rows.forEach((tr, i) => {
          if (i >= listSiswaX7.length) return;
          
          const nama = listSiswaX7[i];
          const status = tr.querySelector('.status-select').value;
          const ket = tr.querySelector('.input-ket').value;
          
          const docId = `${tgl}_${nama.replace(/\s+/g, '')}`;
          const ref = doc(db, "AbsensiX7", docId);
          
          promises.push(setDoc(ref, {
            tanggal: tgl,
            nama: nama,
            status: status,
            keterangan: ket
          }));
        });

        await Promise.all(promises);
        alert("✅ Absensi X-7 berhasil disimpan!");
        muatDataAbsensi();
      } catch (error) {
        console.error(error);
        alert("❌ Gagal menyimpan absensi.");
      } finally {
        btn.textContent = "💾 SIMPAN";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
