<script>
const API_URL = "https://script.google.com/macros/s/AKfycbz2iQQFgVcZ4b4ojOxy4hNPgubWDUl-PAxvZINakPa7RBmDCB5Qpj1OYUC3VcuVuRAuog/exec";

let db = [];
let editId = null;

function loadData() {
  fetch(API_URL)
    .then(res => res.json())
    .then(data => {
      db = data || [];
      tampil();
      tampilRekapSiswa();
    })
    .catch(err => {
      console.error("Gagal load data:", err);
      db = [];
      tampil();
      tampilRekapSiswa();
    });
}

function simpan() {
  const nama = document.getElementById("nama").value;
  const nis = document.getElementById("nis").value;
  const kelas = document.getElementById("kelas").value;
  const jenisRaw = document.getElementById("jenis").value;
  const tgl = document.getElementById("tgl").value;

  if (!nama || !kelas || !jenisRaw || !tgl) {
    alert("Lengkapi dulu: Nama, Kelas, Pelanggaran, dan Tanggal!");
    return;
  }

  const parts = jenisRaw.split("|");
  const jenis = parts[0];
  const total = parseInt(parts[1]) || 0;

  const item = { tgl, nama, nis, kelas, jenis, total };

  if (editId) {
    item.id = editId;
    fetch(API_URL, {
      method: "POST",
      body: JSON.stringify(Object.assign({ action: "edit" }, item))
    })
      .then(res => res.json())
      .then(() => {
        alert("Data berhasil diperbarui!");
        batalEdit();
        loadData();
      })
      .catch(err => {
        console.error(err);
        alert("Gagal update data.");
      });
    return;
  }

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify(Object.assign({ action: "simpan" }, item))
  })
    .then(res => res.json())
    .then(() => {
      alert("Data berhasil disimpan!");
      document.getElementById("nama").value = "";
      document.getElementById("nis").value = "";
      document.getElementById("jenis").value = "";
      document.getElementById("tgl").value = "";
      loadData();
    })
    .catch(err => {
      console.error(err);
      alert("Gagal menyimpan. Cek koneksi / URL Apps Script.");
    });
}

function editData(id) {
  const row = db.find(r => r.id === id);
  if (!row) { alert("Data tidak ditemukan."); return; }

  document.getElementById("nama").value = row.nama || "";
  document.getElementById("nis").value = row.nis || "";
  document.getElementById("kelas").value = row.kelas || "";

  const selectJenis = document.getElementById("jenis");
  let found = false;
  for (let i = 0; i < selectJenis.options.length; i++) {
    const val = selectJenis.options[i].value;
    if (val.split("|")[0] === row.jenis) {
      selectJenis.selectedIndex = i;
      found = true;
      break;
    }
  }
  if (!found) console.warn("Jenis tidak ditemukan:", row.jenis);

  let tgl = row.tgl || "";
  if (tgl && tgl.includes("T")) tgl = tgl.split("T")[0];
  document.getElementById("tgl").value = tgl;

  editId = id;

  const btn = document.querySelector(".btn");
  btn.textContent = "✏️ UPDATE DATA";
  btn.style.background = "#f39c12";

  document.querySelector(".card").scrollIntoView({ behavior: "smooth" });

  if (!document.getElementById("btnBatal")) {
    const btnBatal = document.createElement("button");
    btnBatal.id = "btnBatal";
    btnBatal.textContent = "❌ BATAL EDIT";
    btnBatal.style.cssText = "background:#95a5a6;color:white;width:100%;margin-top:8px;padding:11px;border:none;border-radius:10px;cursor:pointer;font-weight:bold";
    btnBatal.onclick = batalEdit;
    btn.parentNode.insertBefore(btnBatal, btn.nextSibling);
  }
}

function batalEdit() {
  editId = null;
  document.getElementById("nama").value = "";
  document.getElementById("nis").value = "";
  document.getElementById("jenis").value = "";
  document.getElementById("tgl").value = "";

  const btn = document.querySelector(".btn");
  btn.textContent = "SIMPAN";
  btn.style.background = "";

  const btnBatal = document.getElementById("btnBatal");
  if (btnBatal) btnBatal.remove();
}

function hapus(id) {
  if (!confirm("Yakin hapus data ini?")) return;
  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({ action: "hapus", id: id })
  })
    .then(res => res.json())
    .then(() => loadData())
    .catch(err => console.error(err));
}

function hapusSemuaSiswa(namaSiswa) {
  const dataSiswa = db.filter(row => (row.nama || "").trim() === namaSiswa);
  const jumlah = dataSiswa.length;

  if (jumlah === 0) { alert("Tidak ada data."); return; }

  const totalPoin = dataSiswa.reduce((a, b) => a + (parseInt(b.total) || 0), 0);

  if (!confirm("⚠️ HAPUS SEMUA DATA SISWA?\n\nNama: " + namaSiswa + "\nJumlah: " + jumlah + "x\nTotal Poin: " + totalPoin + "\n\nData yang dihapus TIDAK BISA dikembalikan!\n\nLanjutkan?")) return;

  let selesai = 0, gagal = 0;
  const hapusSatu = (index) => {
    if (index >= dataSiswa.length) {
      alert("✅ Selesai!\n\nBerhasil: " + selesai + "\nGagal: " + gagal);
      loadData();
      return;
    }
    fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({ action: "hapus", id: dataSiswa[index].id })
    })
      .then(res => res.json())
      .then(() => { selesai++; hapusSatu(index + 1); })
      .catch(err => { console.error(err); gagal++; hapusSatu(index + 1); });
  };
  hapusSatu(0);
}

function tampil() {
  const keyword = (document.getElementById("cari").value || "").toLowerCase();
  const tbody = document.getElementById("list");
  tbody.innerHTML = "";

  const filtered = db.filter(row => {
    if (!keyword) return true;
    return (
      (row.nama || "").toLowerCase().includes(keyword) ||
      (row.kelas || "").toLowerCase().includes(keyword) ||
      (row.jenis || "").toLowerCase().includes(keyword)
    );
  });

  if (filtered.length === 0) {
    const msg = db.length === 0 ? "Belum ada data. Silakan input pelanggaran." : "Data tidak ditemukan.";
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#888">' + msg + '</td></tr>';
    return;
  }

  filtered.forEach(row => {
    const total = parseInt(row.total) || 0;
    let badgeClass = "Ringan";
    if (total >= 75) badgeClass = "SangatBerat";
    else if (total >= 50) badgeClass = "Berat";
    else if (total >= 25) badgeClass = "Sedang";

    let tglTampil = row.tgl || "";
    if (tglTampil && tglTampil.includes("T")) tglTampil = tglTampil.split("T")[0];

    const tr = document.createElement("tr");
    tr.innerHTML = '<td>' + tglTampil + '</td>'
      + '<td>' + (row.nama || "") + '</td>'
      + '<td>' + (row.kelas || "") + '</td>'
      + '<td>' + (row.jenis || "") + '</td>'
      + '<td><span class="badge ' + badgeClass + '">' + total + '</span></td>'
      + '<td style="text-align:center;white-space:nowrap">'
      + '<button onclick="editData(' + JSON.stringify(row.id) + ')" style="background:#f39c12;color:white;padding:5px 10px;font-size:12px;border:none;border-radius:8px;cursor:pointer;margin-right:3px">✏️ Edit</button>'
      + '<button onclick="hapus(' + JSON.stringify(row.id) + ')" style="background:#e74c3c;color:white;padding:5px 10px;font-size:12px;border:none;border-radius:8px;cursor:pointer">🗑 Hapus</button>'
      + '</td>';
    tbody.appendChild(tr);
  });
}

function tampilRekapSiswa() {
  const keyword = (document.getElementById("cariSiswa").value || "").toLowerCase();
  const tbody = document.getElementById("rekapSiswa");
  tbody.innerHTML = "";

  const rekap = {};
  db.forEach(row => {
    const nama = (row.nama || "").trim();
    if (!nama) return;
    if (!rekap[nama]) {
      rekap[nama] = { nama: nama, kelas: row.kelas || "", jumlah: 0, total: 0, skorList: [] };
    }
    rekap[nama].jumlah += 1;
    const poin = parseInt(row.total) || 0;
    rekap[nama].total += poin;
    rekap[nama].skorList.push(poin);
  });

  let list = Object.values(rekap);
  if (keyword) list = list.filter(s => s.nama.toLowerCase().includes(keyword));
  list.sort((a, b) => b.total - a.total);

  if (list.length === 0) {
    const msg = db.length === 0 ? "Belum ada data pelanggaran." : "Data tidak ditemukan.";
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#888">' + msg + '</td></tr>';
    return;
  }

  list.forEach((s, i) => {
    let kategori = "Ringan", warna = "#2ecc71";
    if (s.total >= 75) { kategori = "Sangat Berat"; warna = "#000"; }
    else if (s.total >= 50) { kategori = "Berat"; warna = "#e74c3c"; }
    else if (s.total >= 25) { kategori = "Sedang"; warna = "#f1c40f"; }

    const skorStr = s.skorList.join(" + ");

    const tr = document.createElement("tr");
    tr.innerHTML =
      '<td style="text-align:center">' + (i + 1) + '</td>' +
      '<td><b>' + s.nama + '</b></td>' +
      '<td style="text-align:center">' + s.kelas + '</td>' +
      '<td style="text-align:center"><b>' + s.jumlah + 'x</b></td>' +
      '<td style="text-align:center;font-size:12px;color:#555">' + skorStr + '</td>' +
      '<td style="text-align:center"><b style="color:' + warna + ';font-size:16px">' + s.total + '</b></td>' +
      '<td style="text-align:center"><span style="background:' + warna + ';color:white;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:bold">' + kategori + '</span></td>' +
      '<td style="text-align:center"><button onclick="hapusSemuaSiswa(' + JSON.stringify(s.nama) + ')" style="background:#e74c3c;color:white;padding:5px 10px;font-size:11px;border:none;border-radius:8px;cursor:pointer;font-weight:bold">🗑 Hapus Semua</button></td>';
    tbody.appendChild(tr);
  });
}

function exportExcel() {
  if (db.length === 0) { alert("Belum ada data."); return; }
  const data = db.map(row => ({
    Tanggal: row.tgl || "", Nama: row.nama || "", NIS: row.nis || "",
    Kelas: row.kelas || "", Pelanggaran: row.jenis || "", Total: row.total || 0
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Riwayat Pelanggaran");
  XLSX.writeFile(wb, "Riwayat_Pelanggaran_XI6.xlsx");
}

function exportRekapSiswa() {
  const rekap = {};
  db.forEach(row => {
    const nama = (row.nama || "").trim();
    if (!nama) return;
    if (!rekap[nama]) {
      rekap[nama] = { Nama: nama, Kelas: row.kelas || "", JumlahPelanggaran: 0, TotalPoin: 0 };
    }
    rekap[nama].JumlahPelanggaran += 1;
    rekap[nama].TotalPoin += parseInt(row.total) || 0;
  });

  const list = Object.values(rekap).sort((a, b) => b.TotalPoin - a.TotalPoin);
  if (list.length === 0) { alert("Belum ada data."); return; }

  list.forEach(s => {
    if (s.TotalPoin >= 75) s.Kategori = "Sangat Berat";
    else if (s.TotalPoin >= 50) s.Kategori = "Berat";
    else if (s.TotalPoin >= 25) s.Kategori = "Sedang";
    else s.Kategori = "Ringan";
  });

  const ws = XLSX.utils.json_to_sheet(list);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Rekap Per Siswa");
  XLSX.writeFile(wb, "Rekap_Poin_Per_Siswa.xlsx");
}
