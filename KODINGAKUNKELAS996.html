<script>
// Tempelkan URL Web App dari Google Apps Script di sini
const API_URL = "https://script.google.com/macros/s/AKfycbz2iQQFgVcZ4b4ojOxy4hNPgubWDUl-PAxvZINakPa7RBmDCB5Qpj1OYUC3VcuVuRAuog/exec";
  
let db = [];

// 1. Ambil data dari Google Sheets saat web dibuka
function loadData() {
  fetch(API_URL)
    .then(res => res.json())
    .then(data => {
      db = data;
      tampil();
    });
}

// 2. Simpan data baru ke Google Sheets
function simpanDataKeCloud(item) {
  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({ action: "simpan", ...item })
  }).then(() => loadData());
}

// 3. Hapus data dari Google Sheets
function hapusDataFromCloud(id) {
  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({ action: "hapus", id: id })
  }).then(() => loadData());
}
function tampil() {
  const keyword = (document.getElementById("cari").value || "").toLowerCase();
  const tbody = document.getElementById("list");
  tbody.innerHTML = "";

  const filtered = db.filter(row => {
    if (!keyword) return true;
    return (
      (row.nama || "").toLowerCase().includes(keyword) ||
      (row.kelas || "").toLowerCase().includes(keyword) ||
      (row.jenis || "").toLowerCase().includes(keyword)
    );
  });

  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:#888">
      ${db.length === 0 ? "Belum ada data. Silakan input pelanggaran." : "Data tidak ditemukan."}
    </td></tr>`;
    return;
  }

// Panggil fungsi pertama kali saat halaman dimuat
loadData();
</script>
