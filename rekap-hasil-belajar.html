<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rekap Hasil Belajar - SIPADAK</title>
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBZIzD2337cdCxhV2EdcDMK3iwnaR0GiS4",
      authDomain: "sipadak-xi6.firebaseapp.com",
      projectId: "sipadak-xi6",
      storageBucket: "sipadak-xi6.firebasestorage.app",
      messagingSenderId: "981787419124",
      appId: "1:981787419124:web:6622e4bd0b928e9bea19a1"
    };
    const app = initializeApp(firebaseConfig);
    window.db = getFirestore(app);
    window.fbFunc = { collection, getDocs, query, orderBy };
    window.dispatchEvent(new Event('firebaseReady'));
  </script>

  <style>
    :root { --hijau: #0a3622; --gold: #d4af37; --bg: #f3f5f4; --text: #1f2937; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
    .header { background: var(--hijau); color: #f6e27a; display: flex; justify-content: space-between; padding: 15px 22px; border-bottom: 4px solid var(--gold); }
    .header h1 { margin: 0; font-size: 20px; }
    .container { max-width: 1000px; margin: 20px auto; padding: 0 16px; }
    .card { background: white; border-radius: 14px; padding: 20px; box-shadow: 0 2px 9px rgba(0,0,0,0.07); margin-bottom: 20px; }
    .btn-back { background: var(--hijau); color: white; text-decoration: none; padding: 10px 15px; border-radius: 8px; font-size: 14px; font-weight: bold; display: inline-block; margin-bottom: 15px; }
    h3 { margin-top: 0; color: var(--hijau); }
    
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border: 1px solid #e5e7eb; padding: 8px; text-align: left; }
    th { background: #f8fafc; text-align: center; }
    .btn-print { background: #e67e22; color: white; padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; font-size: 12px; }
    
    .print-area { display: none; padding: 20px; }
    
    @media print {
      .no-print { display: none !important; }
      .print-area { display: block !important; }
      body { background: white; }
      .card { box-shadow: none; border: none; padding: 0; }
    }
  </style>
</head>
<body>

  <div class="header no-print">
    <h1>📁 Rekap Hasil Belajar</h1>
    <span>SIPADAK XI-6</span>
  </div>

  <div class="container no-print">
    <a href="javascript:void(0)" onclick="kembali()" class="btn-back">⬅ Kembali ke Dashboard</a>

    <!-- CARD 1: HASIL CBT (SKOR) -->
    <div class="card">
      <h3>Daftar Nilai Pre-Test & Post-Test</h3>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>No</th>
              <th>Nama Siswa</th>
              <th>Jenis Ujian</th>
              <th>Tanggal</th>
              <th>Skor</th>
              <th>Nilai Akhir</th>
            </tr>
          </thead>
          <tbody id="listHasilCBT">
            <tr><td colspan="6" style="text-align:center;">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- CARD 2: HASIL LKPD -->
    <div class="card">
      <h3>Jawaban LKPD Siswa</h3>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>No</th>
              <th>Nama Siswa</th>
              <th>Tanggal</th>
              <th>Jawaban Esai (Ringkas)</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="listHasilLKPD">
            <tr><td colspan="5" style="text-align:center;">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    if(localStorage.getItem("siTatibLogin") !== "true") window.location.href = "index.html";

    function kembali() {
      if (window.parent && window.parent.tutupHalaman) {
        window.parent.tutupHalaman();
      } else {
        window.location.href = "dashboard-induk.html";
      }
    }

    window.addEventListener('firebaseReady', async () => {
      const { collection, getDocs, query, orderBy } = window.fbFunc;
      const db = window.db;

      // 1. LOAD HASIL CBT
      const tbodyCBT = document.getElementById("listHasilCBT");
      let htmlCBT = ""; let noCBT = 1;

      try {
        const qCBT = query(collection(db, "HasilUjian"), orderBy("tanggal", "desc"));
        const snapCBT = await getDocs(qCBT);
        
        if(snapCBT.empty) {
          tbodyCBT.innerHTML = '<tr><td colspan="6" style="text-align:center;">Belum ada data ujian.</td></tr>';
        } else {
          snapCBT.forEach(doc => {
            const d = doc.data();
            htmlCBT += `<tr>
              <td style="text-align:center;">${noCBT++}</td>
              <td><b>${d.nama}</b></td>
              <td>${d.jenisUjian || "Pre-Test"}</td>
              <td>${d.tanggal}</td>
              <td style="text-align:center;">${d.skor} / ${d.totalSoal}</td>
              <td style="text-align:center; font-weight:bold; color:${d.persentase >= 70 ? 'green' : 'red'};">${d.persentase}</td>
            </tr>`;
          });
          tbodyCBT.innerHTML = htmlCBT;
        }
      } catch (e) { console.error(e); }

      // 2. LOAD HASIL LKPD
      const tbodyLKPD = document.getElementById("listHasilLKPD");
      let htmlLKPD = ""; let noLKPD = 1;

      try {
        const qLKPD = query(collection(db, "HasilLKPD"), orderBy("tanggal", "desc"));
        const snapLKPD = await getDocs(qLKPD);
        
        if(snapLKPD.empty) {
          tbodyLKPD.innerHTML = '<tr><td colspan="5" style="text-align:center;">Belum ada jawaban LKPD.</td></tr>';
        } else {
          snapLKPD.forEach(doc => {
            const d = doc.data();
            const jawabanRingkas = d.jawaban.substring(0, 50) + "...";
            
            htmlLKPD += `<tr>
              <td style="text-align:center;">${noLKPD++}</td>
              <td><b>${d.nama}</b></td>
              <td>${d.tanggal}</td>
              <td>${jawabanRingkas}</td>
              <td style="text-align:center;">
                <button class="btn-print" onclick="cetakLKPD('${d.nama}', '${d.tanggal}', \`${d.jawaban.replace(/`/g, '')}\`)">🖨️ Cetak</button>
              </td>
            </tr>`;
          });
          tbodyLKPD.innerHTML = htmlLKPD;
        }
      } catch (e) { console.error(e); }
    });

    // Fungsi Cetak Khusus Satu Siswa
    function cetakLKPD(nama, tanggal, jawaban) {
      const win = window.open('', '_blank');
      win.document.write(`
        <html><head><title>LKPD - ${nama}</title>
        <style>body{font-family:sans-serif;padding:40px;} h2{text-align:center;}</style>
        </head><body>
          <h2>LEMBAR KERJA PESERTA DIDIK</h2>
          <p><b>Nama:</b> ${nama} <br><b>Tanggal:</b> ${tanggal}</p>
          <hr>
          <div style="white-space:pre-wrap; line-height:1.6;">${jawaban}</div>
          <div style="margin-top:50px; text-align:right;">
            <p>Guru Mata Pelajaran Ekonomi,</p><br><br><br>
            <p><b>ADI FIRMANSYAH, S.E.</b><br>NIP. 198301112025211003</p>
          </div>
        </body></html>
      `);
      win.document.close();
      win.print();
    }
  </script>
</body>
</html>
