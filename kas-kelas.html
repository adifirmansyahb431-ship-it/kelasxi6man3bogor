  <script>
    // 1. CEK LOGIN & ROLE
    const dataSiswa = JSON.parse(localStorage.getItem("dataSiswaLogin"));
    const roleGuru = localStorage.getItem("siTatibRole");
    const isAdmin = (roleGuru === "admin" || roleGuru === "sekretaris");

    // Tentukan arah tombol kembali (Kembali ke Dashboard jika Admin, ke Profil jika Siswa)
    const btnKembali = document.getElementById('btnKembali');

    if (isAdmin) {
      btnKembali.href = "dashboard-induk.html";
      // Tampilkan menu admin
      document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'inline-block');
    } else if (dataSiswa) {
      btnKembali.href = "profil-siswa.html";
      // Sembunyikan tab pemasukan, buka tab status
      document.getElementById('tabMenuPemasukan').classList.remove('active');
      document.getElementById('tab-pemasukan').classList.remove('active');
      document.getElementById('tabMenuSiswa').classList.add('active');
      document.getElementById('tab-siswa').classList.add('active');
    } else {
      alert("Sesi tidak valid. Silakan login ulang.");
      window.location.href = "index.html";
    }

    // Fungsi Ganti Tab
    function bukaTab(nama) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + nama).classList.add('active');
      event.target.classList.add('active');
    }

    // Format Rupiah
    function formatRp(angka) {
      return "Rp " + parseInt(angka).toLocaleString('id-ID');
    }

    // 2. SIMPAN KAS (MASUK / KELUAR)
    async function simpanKas(e, tipe) {
      if (!isAdmin) return alert("Hanya Admin yang bisa mencatat kas!");
      
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.textContent = "⏳ Menyimpan...";
      btn.disabled = true;

      const tgl = new Date().toISOString().split('T')[0];
      let data = { tanggal: tgl, tipe: tipe };

      if(tipe === 'Pemasukan') {
        data.nama = document.getElementById('inNamaKas').value;
        data.nominal = parseInt(document.getElementById('inNominalKas').value);
        data.keterangan = document.getElementById('inKetKas').value;
      } else {
        data.nama = "Kas Kelas";
        data.nominal = parseInt(document.getElementById('inNominalKeluar').value);
        data.keterangan = document.getElementById('inKetKeluar').value;
      }

      try {
        const { collection, addDoc } = window.fbFunc;
        const db = window.db;
        await addDoc(collection(db, "KasKelas"), data);
        
        alert("✅ Data berhasil disimpan!");
        e.target.reset();
        muatDataKas(); // Refresh data
      } catch (error) {
        alert("❌ Gagal menyimpan: " + error.message);
      } finally {
        btn.textContent = tipe === 'Pemasukan' ? "Simpan Pemasukan" : "Simpan Pengeluaran";
        btn.disabled = false;
      }
    }

    // 3. LOAD DATA KAS DARI FIREBASE
    async function muatDataKas() {
      try {
        if (!window.fbFunc) {
          setTimeout(muatDataKas, 500);
          return;
        }

        const { collection, getDocs } = window.fbFunc;
        const db = window.db;

        const querySnapshot = await getDocs(collection(db, "KasKelas"));
        let dataKas = [];
        querySnapshot.forEach((doc) => {
          dataKas.push(doc.data());
        });

        // Urutkan berdasarkan tanggal terbaru
        dataKas.sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));

        let totalMasuk = 0;
        let totalKeluar = 0;
        let tabelMasukHTML = "";
        let tabelKeluarHTML = "";
        let tabelLPJHTML = "";
        let siswaLunas = [];

        dataKas.forEach((row) => {
          const tglFormat = new Date(row.tanggal).toLocaleDateString('id-ID');
          
          tabelLPJHTML += `
            <tr>
              <td>${tglFormat}</td>
              <td>${row.tipe}</td>
              <td>${row.keterangan}</td>
              <td style="color: ${row.tipe === 'Pemasukan' ? '#00b894' : '#ff4757'}; font-weight:bold;">
                ${row.tipe === 'Pemasukan' ? '+' : '-'} ${formatRp(row.nominal)}
              </td>
            </tr>
          `;

          if (row.tipe === 'Pemasukan') {
            totalMasuk += row.nominal;
            siswaLunas.push(row.nama.toLowerCase());
            tabelMasukHTML += `
              <tr>
                <td>${tglFormat}</td>
                <td>${row.nama}</td>
                <td style="color:#00b894; font-weight:bold;">${formatRp(row.nominal)}</td>
                <td>${row.keterangan}</td>
              </tr>
            `;
          } else {
            totalKeluar += row.nominal;
            tabelKeluarHTML += `
              <tr>
                <td>${tglFormat}</td>
                <td>${row.keterangan}</td>
                <td style="color:#ff4757; font-weight:bold;">${formatRp(row.nominal)}</td>
              </tr>
            `;
          }
        });

        // Hitung Saldo
        const saldo = totalMasuk - totalKeluar;
        document.getElementById('saldoTampil').innerText = formatRp(saldo);
        document.getElementById('lpjMasuk').innerText = formatRp(totalMasuk);
        document.getElementById('lpjKeluar').innerText = formatRp(totalKeluar);
        document.getElementById('lpjSaldo').innerText = formatRp(saldo);

        // Render Tabel
        document.getElementById('tabelPemasukan').innerHTML = tabelMasukHTML || '<tr><td colspan="4" style="text-align:center;">Belum ada data</td></tr>';
        document.getElementById('tabelPengeluaran').innerHTML = tabelKeluarHTML || '<tr><td colspan="3" style="text-align:center;">Belum ada data</td></tr>';
        document.getElementById('tabelLPJ').innerHTML = tabelLPJHTML || '<tr><td colspan="4" style="text-align:center;">Belum ada data</td></tr>';

        // Render Status Siswa
        muatStatusSiswa(siswaLunas);

      } catch (error) {
        console.error("Error:", error);
      }
    }

    // 4. LOAD DAFTAR SISWA & CEK LUNAS/BELUM
    async function muatStatusSiswa(siswaLunas) {
      try {
        const { collection, getDocs } = window.fbFunc;
        const db = window.db;

        const querySnapshot = await getDocs(collection(db, "Siswa"));
        let tabelHTML = "";

        querySnapshot.forEach((doc) => {
          const siswa = doc.data();
          const nama = siswa.nama || "Tanpa Nama";
          
          // Cek apakah namanya ada di daftar pemasukan
          const sudahBayar = siswaLunas.includes(nama.toLowerCase());
          
          tabelHTML += `
            <tr>
              <td>${nama}</td>
              <td>
                ${sudahBayar 
                  ? '<span class="badge-lunas">LUNAS</span>' 
                  : '<span class="badge-belum">BELUM BAYAR</span>'}
              </td>
            </tr>
          `;
        });

        document.getElementById('tabelStatusSiswa').innerHTML = tabelHTML;

      } catch (error) {
        console.error("Error load siswa:", error);
      }
    }

    // Jalankan saat halaman dibuka
    window.addEventListener('firebaseReady', () => {
      muatDataKas();
    });
  </script>
