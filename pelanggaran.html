<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Input Pelanggaran - SI-TATIB</title>
  <style>
    :root { --hijau: #0a3622; --gold: #d4af37; --bg: #f3f5f4; --text: #1f2937; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Segoe UI, sans-serif; background: var(--bg); color: var(--text); }
    .header { background: var(--hijau); color: #f6e27a; display: flex; justify-content: space-between; padding: 15px 22px; border-bottom: 4px solid var(--gold); }
    .header h1 { margin: 0; font-size: 20px; }
    .container { max-width: 1000px; margin: 20px auto; padding: 0 16px; }
    .card { background: white; border-radius: 14px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 9px rgba(0,0,0,0.07); }
    h3 { margin-top: 0; color: var(--hijau); }
    label { font-weight: bold; font-size: 14px; display: block; margin-bottom: 5px; }
    input, select { width: 100%; padding: 11px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 12px; box-sizing: border-box; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
    button { border: none; border-radius: 8px; padding: 12px; font-weight: bold; cursor: pointer; }
    .btn-save { background: #16a085; color: white; width: 100%; }
    .btn-back { background: var(--hijau); color: white; text-decoration: none; padding: 10px 15px; border-radius: 8px; font-size: 14px; font-weight: bold; display: inline-block; margin-bottom: 15px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border: 1px solid #e5e7eb; padding: 10px; text-align: left; }
    th { background: #f5f5f5; }
    .btn-aksi { padding: 6px 10px; border-radius: 6px; font-size: 12px; color: white; cursor: pointer; border: none; margin-right: 5px; }
    .btn-hapus { background: #e74c3c; }
    .btn-edit { background: #f39c12; }
    @media (max-width: 600px) { .grid-3 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="header">
    <h1>📝 Input Pelanggaran</h1>
    <span>MAN 3 BOGOR</span>
  </div>

  <div class="container">
    <a href="index.html" class="btn-back">⬅ Kembali ke Dashboard</a>

    <div class="card">
      <h3>Form Pelanggaran</h3>
      <div class="grid-3">
        <div>
          <label>Nama Siswa</label>
          <select id="nama"><option value="">Pilih Siswa</option></select>
        </div>
        <div>
          <label>NIS</label>
          <input id="nis" type="text" placeholder="Masukkan NIS">
        </div>
        <div>
          <label>Kelas</label>
          <select id="kelas">
            <option value="XI-6">XI-6</option>
          </select>
        </div>
      </div>

      <label>Jenis Pelanggaran</label>
      <select id="jenis">
      <option value="">-- Pilih Jenis Pelanggaran --</option>

        <option value="Berkelahi hingga menimbulkan korban|100">Berkelahi hingga menimbulkan korban (100)</option>
        <option value="Membawa senjata api/ senjata tajam|100">Membawa senjata api/ senjata tajam (100)</option>
        <option value="Mengkonsumsi dan atau mengedarkan NARKOBA|100">Mengkonsumsi dan atau mengedarkan NARKOBA (100)</option>
        <option value="Terlibat judi online dan Video Call Sex (VCS)|100">Terlibat judi online dan Video Call Sex (VCS) (100)</option>
        <option value="Membawa atau mengkonsumsi minuman keras|100">Membawa atau mengkonsumsi minuman keras (100)</option>
        <option value="Tidak memenuhi panggilan orang tua minimal 3 kali|100">Tidak memenuhi panggilan orang tua minimal 3 kali (100)</option>
        <option value="Membawa obat-obatan/zat/alat penyalahgunaan narkoba|100">Membawa obat-obatan/zat/alat penyalahgunaan narkoba (100)</option>
        <option value="Membawa titipan barang-barang terkait NARKOBA|100">Membawa titipan barang-barang terkait NARKOBA (100)</option>
        <option value="Merekam, mengedarkan, menyebarkan video/foto pornografi|100">Merekam, mengedarkan, menyebarkan video/foto pornografi (100)</option>
        <option value="Menikah selama menjadi peserta didik|100">Menikah selama menjadi peserta didik (100)</option>
        <option value="Terdeteksi hamil saat menjadi peserta didik|100">Terdeteksi hamil saat menjadi peserta didik (100)</option>
        <option value="Mengikuti atau mengadakan kegiatan perjudian|100">Mengikuti atau mengadakan kegiatan perjudian (100)</option>
        <option value="Mencuri uang atau mengambil barang milik orang lain|75">Mencuri uang atau mengambil barang milik orang lain (75)</option>
        <option value="Melawan, mengancam, memfitnah kepala madrasah/guru/karyawan|75">Melawan, mengancam, memfitnah kepala madrasah/guru/karyawan (75)</option>
        <option value="Ribut dengan memberi ancaman sesama teman|50">Ribut dengan memberi ancaman sesama teman (50)</option>
        <option value="Berkelahi hingga menimbulkan keributan/onar|50">Berkelahi hingga menimbulkan keributan/onar (50)</option>
        <option value="Pacaran di lingkungan madrasah|50">Pacaran di lingkungan madrasah (50)</option>
        <option value="Bertato baik temporary atau permanen|50">Bertato baik temporary atau permanen (50)</option>
        <option value="Merusak/menghilangkan benda milik madrasah/guru/teman|50">Merusak/menghilangkan benda milik madrasah/guru/teman (50)</option>
        <option value="Bergerombol di luar madrasah radius 500m >15 menit|35">Bergerombol di luar madrasah radius 500m >15 menit (35)</option>
        <option value="Merokok tembakau/elektrik (vape)|30">Merokok tembakau/elektrik (vape) (30)</option>
        <option value="Masuk/keluar tidak melalui gerbang utama|25">Masuk/keluar tidak melalui gerbang utama (25)</option>
        <option value="Tidak menjalankan shalat Jumat|25">Tidak menjalankan shalat Jumat (25)</option>
        <option value="Membawa/menitipkan/mendapat titipan rokok|25">Membawa/menitipkan/mendapat titipan rokok (25)</option>
        <option value="Tidak menyampaikan panggilan orang tua|25">Tidak menyampaikan panggilan orang tua (25)</option>
        <option value="Mengoperasikan HP saat KBM tanpa izin|20">Mengoperasikan HP saat KBM tanpa izin (20)</option>
        <option value="Berhias berlebihan / perhiasan berlebih|20">Berhias berlebihan / perhiasan berlebih (20)</option>
        <option value="Ujaran kebencian / sarkasme / hoax online & offline|20">Ujaran kebencian / sarkasme / hoax online & offline (20)</option>
        <option value="Mengotori/mencoret benda milik madrasah/teman|15">Mengotori/mencoret benda milik madrasah/teman (15)</option>
        <option value="Kuku panjang / cat kuku / kuku palsu|10">Kuku panjang / cat kuku / kuku palsu (10)</option>
        <option value="Jilbab tidak sesuai ketentuan / transparan / tanpa ciput|10">Jilbab tidak sesuai ketentuan / transparan / tanpa ciput (10)</option>
        <option value="Merusak/malware/mengeksploitasi sistem komputer|10">Merusak/malware/mengeksploitasi sistem komputer (10)</option>
        <option value="Membuat keributan/kegaduhan saat KBM|5">Membuat keributan/kegaduhan saat KBM (5)</option>
        <option value="Peserta didik putra masuk MCK putri / sebaliknya|5">Peserta didik putra masuk MCK putri / sebaliknya (5)</option>
        <option value="Menyimpan buku pelajaran di lemari/laci kelas|5">Menyimpan buku pelajaran di lemari/laci kelas (5)</option>
        <option value="Melanggar ketertiban di perpustakaan|5">Melanggar ketertiban di perpustakaan (5)</option>
        <option value="Membuang sampah tidak pada tempatnya|5">Membuang sampah tidak pada tempatnya (5)</option>
      </optgroup>
      <optgroup label="B. PASAL KEDISIPLINAN">
        <option value="Akumulasi tidak masuk 14 hari dalam 1 semester|70">Akumulasi tidak masuk 14 hari dalam 1 semester (70)</option>
        <option value="Tidak masuk madrasah dengan surat palsu|15">Tidak masuk madrasah dengan surat palsu (15)</option>
        <option value="Meninggalkan kelas tanpa izin saat KBM|10">Meninggalkan kelas tanpa izin saat KBM (10)</option>
        <option value="Tidak mengikuti upacara PHBN / PHBI|10">Tidak mengikuti upacara PHBN / PHBI (10)</option>
        <option value="Berada di luar kelas saat KBM tanpa izin|10">Berada di luar kelas saat KBM tanpa izin (10)</option>
        <option value="Tidak mengikuti upacara bendera hari Senin|5">Tidak mengikuti upacara bendera hari Senin (5)</option>
        <option value="Tidak masuk madrasah karena alpa|5">Tidak masuk madrasah karena alpa (5)</option>
        <option value="Tidak mengikuti kegiatan hari besar yang ditugaskan|5">Tidak mengikuti kegiatan hari besar yang ditugaskan (5)</option>
        <option value="Terlambat masuk madrasah|5">Terlambat masuk madrasah (5)</option>
      </optgroup>
      <optgroup label="C. PASAL KERAPIHAN">
        <option value="Tidak berseragam olahraga saat praktek|5">Tidak berseragam olahraga saat praktek (5)</option>
        <option value="Tidak memakai perlengkapan upacara|5">Tidak memakai perlengkapan upacara (5)</option>
        <option value="Tidak memakai atribut seragam saat KBM|5">Tidak memakai atribut seragam saat KBM (5)</option>
        <option value="Memakai kaos oblong hitam untuk dalaman|5">Memakai kaos oblong hitam untuk dalaman (5)</option>
        <option value="Memakai topi bukan topi madrasah di kelas|5">Memakai topi bukan topi madrasah di kelas (5)</option>
        <option value="Tidak memakai sepatu berwarna dasar hitam|5">Tidak memakai sepatu berwarna dasar hitam (5)</option>
        <option value="Memakai kaos kaki selain warna putih|5">Memakai kaos kaki selain warna putih (5)</option>
        <option value="Memakai rok ketat / sempit / terdapat belahan|5">Memakai rok ketat / sempit / terdapat belahan (5)</option>
        <option value="Memakai celana ketat / jeans|5">Memakai celana ketat / jeans (5)</option>
        <option value="Memakai seragam robek atau dicoret-coret|5">Memakai seragam robek atau dicoret-coret (5)</option>
        <option value="Baju siswa putra tidak dimasukkan|5">Baju siswa putra tidak dimasukkan (5)</option>
        <option value="Rambut tidak sesuai ketentuan ukuran|5">Rambut tidak sesuai ketentuan ukuran (5)</option>
        <option value="Memakai cat rambut|5">Memakai cat rambut (5)</option>
        <option value="Memakai seragam tidak sesuai jadwal|5">Memakai seragam tidak sesuai jadwal (5)</option>
        <option value="Memakai jaket/sweater di kelas saat KBM|5">Memakai jaket/sweater di kelas saat KBM (5)</option>
        <option value="Memakai baju seragam dikeluarkan|5">Memakai baju seragam dikeluarkan (5)</option>
        <option value="Memakai baju terlalu sempit / terlalu longgar|5">Memakai baju terlalu sempit / terlalu longgar (5)</option>
      </optgroup>
    </select>

      <label>Tanggal</label>
      <input id="tgl" type="date" />

      <button class="btn-save" onclick="simpanData()">💾 SIMPAN PELANGGARAN</button>
    </div>

    <div class="card">
      <h3>Riwayat Pelanggaran</h3>
      <input type="text" id="cari" placeholder="Cari nama..." onkeyup="tampil()">
      <div style="overflow-x: auto; margin-top: 10px;">
        <table>
          <thead><tr><th>Tgl</th><th>Nama</th><th>Kelas</th><th>Pelanggaran</th><th>Poin</th><th>Aksi</th></tr></thead>
          <tbody id="list"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    if(localStorage.getItem("siTatibLogin") !== "true") window.location.href = "index.html";
    
    const STORAGE_KEY = "siTatibData";
    let db = [];
    let editId = null;

    window.onload = function() {
      document.getElementById('tgl').valueAsDate = new Date();
      db = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      
      // Load dropdown siswa
      const listSiswa = JSON.parse(localStorage.getItem('siTatibSiswa') || "[]");
      const select = document.getElementById('nama');
      if(listSiswa.length > 0) {
        listSiswa.forEach(nama => select.innerHTML += `<option value="${nama}">${nama}</option>`);
      } else {
        select.innerHTML += `<option value="ADINDA RIZKY AYU PUTRI">ADINDA RIZKY AYU PUTRI</option>`;
      }
      
      tampil();
    };

    function simpanData() {
      const nama = document.getElementById("nama").value;
      const nis = document.getElementById("nis").value;
      const kelas = document.getElementById("kelas").value;
      const jenisRaw = document.getElementById("jenis").value;
      const tgl = document.getElementById("tgl").value;

      if (!nama || !jenisRaw || !tgl) return alert("Lengkapi data yang wajib diisi!");

      const parts = jenisRaw.split("|");
      const jenis = parts[0];
      const total = parseInt(parts[1]) || 0;

      if (editId) {
        db = db.map(row => String(row.id) === String(editId) ? { ...row, tgl, nama, nis, kelas, jenis, total } : row);
        alert("Data diperbarui!");
        editId = null;
      } else {
        db.unshift({ id: Date.now(), tgl, nama, nis, kelas, jenis, total });
        alert("Data disimpan!");
      }
      
      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      document.getElementById('jenis').value = "";
      tampil();
    }

    function tampil() {
      const keyword = document.getElementById("cari").value.toLowerCase();
      const tbody = document.getElementById("list");
      tbody.innerHTML = "";

      const filtered = db.filter(r => (r.nama||"").toLowerCase().includes(keyword));
      
      if(filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Belum ada data.</td></tr>';
        return;
      }

      filtered.forEach(r => {
        tbody.innerHTML += `
          <tr>
            <td>${r.tgl}</td>
            <td><b>${r.nama}</b></td>
            <td>${r.kelas}</td>
            <td>${r.jenis}</td>
            <td style="text-align:center;"><b>${r.total}</b></td>
            <td>
              <button class="btn-aksi btn-edit" onclick="editData(${r.id})">Edit</button>
              <button class="btn-aksi btn-hapus" onclick="hapus(${r.id})">Hapus</button>
            </td>
          </tr>
        `;
      });
    }

    function hapus(id) {
      if(!confirm("Hapus data ini?")) return;
      db = db.filter(r => r.id !== id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      tampil();
    }

    function editData(id) {
      const row = db.find(r => r.id === id);
      if(!row) return;
      
      document.getElementById("nama").value = row.nama;
      document.getElementById("nis").value = row.nis;
      document.getElementById("kelas").value = row.kelas;
      document.getElementById("tgl").value = row.tgl;
      
      const select = document.getElementById("jenis");
      for(let i=0; i<select.options.length; i++){
        if(select.options[i].value.startsWith(row.jenis)) {
          select.selectedIndex = i;
          break;
        }
      }
      editId = id;
      alert("Silakan ubah data di form atas, lalu klik SIMPAN kembali.");
      window.scrollTo(0, 0);
    }
  </script>
</body>
</html>
