<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Data Siswa - SI-TATIB</title>
  
  <!-- Library Pembaca Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  
  <style>
    :root {
      --hijau: #0a3622;
      --gold: #d4af37;
      --bg: #f3f5f4;
      --text: #1f2937;
      --card: #ffffff;
      --hijau-muda: #16a085;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Segoe UI, Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .header {
      background: var(--hijau);
      color: #f6e27a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 22px;
      border-bottom: 4px solid var(--gold);
    }
    .header h1 { margin: 0; font-size: 20px; }
    .container {
      max-width: 800px;
      margin: 20px auto;
      padding: 0 16px;
    }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 2px 9px rgba(0,0,0,0.07);
    }
    h3 { margin-top: 0; color: var(--hijau); }
    p { font-size: 13px; color: #666; }
    
    .upload-box {
      display: block;
      width: 100%;
      padding: 30px 12px;
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      background: #fafafa;
      text-align: center;
      cursor: pointer;
      margin-bottom: 20px;
      transition: 0.3s;
    }
    .upload-box:hover { border-color: var(--hijau-muda); background: #f0fdf4; }
    
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      background: var(--hijau-muda);
      color: white;
      display: none; /* Tampil setelah file dibaca */
    }
    button:hover { background: #12876f; }
    
    .status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    .status.success { background: #e8f5e9; color: #1b5e20; display: block; }
    .status.error { background: #ffebee; color: #b71c1c; display: block; }
    .status.info { background: #e3f2fd; color: #0d47a1; display: block; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-bottom: 15px;
    }
    th, td { border: 1px solid #e5e7eb; padding: 8px 10px; text-align: left; }
    th { background: #f5f5f5; }
    
    .btn-back {
      display: inline-block;
      margin-bottom: 15px;
      text-decoration: none;
      background: var(--hijau);
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>📤 Upload Daftar Siswa</h1>
    <span>MAN 3 BOGOR</span>
  </div>

  <div class="container">
    <a href="index.html" class="btn-back">⬅ Kembali ke Aplikasi</a>

    <div class="card">
      <h3>Upload File Excel</h3>
      <p>Pastikan file Excel (.xlsx) memiliki kolom bertuliskan <b>NAMA SISWA</b> atau <b>NAMA</b> di baris pertama.</p>
      
      <label class="upload-box">
        <input type="file" id="fileExcel" accept=".xlsx,.xls" style="display:none;" onchange="bacaFileExcel(event)" />
        <div style="font-size:40px;margin-bottom:10px">📊</div>
        <div style="font-weight:700">Klik untuk pilih file Excel</div>
        <div style="font-size:12px;color:#888;margin-top:5px">atau drag & drop</div>
      </label>

      <div id="statusUpload" class="status"></div>

      <div id="previewArea" style="display:none; margin-top:20px;">
        <h4>Preview 5 Data Pertama:</h4>
        <div style="overflow-x:auto;">
          <table>
            <thead><tr><th>No</th><th>Nama Siswa</th></tr></thead>
            <tbody id="previewTbody"></tbody>
          </table>
        </div>
        <button id="btnSimpan" onclick="simpanDataExcel()">💾 SIMPAN SEMUA DATA SISWA</button>
      </div>
    </div>
  </div>

  <script>
    let dataSiswaExcel = [];

    function bacaFileExcel(event) {
      const file = event.target.files[0];
      if (!file) return;

      const status = document.getElementById("statusUpload");
      status.className = "status info";
      status.textContent = "⏳ Membaca file Excel...";

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const worksheet = workbook.Sheets[workbook.SheetNames[0]];
          const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
          
          if (json.length < 2) {
            status.className = "status error";
            status.textContent = "❌ File kosong atau tidak ada data.";
            return;
          }

          const header = json[0];
          let idxNama = -1;

          // Cari kolom NAMA
          for (let i = 0; i < header.length; i++) {
            const h = String(header[i] || "").toUpperCase();
            if (h.includes("NAMA")) idxNama = i;
          }

          if (idxNama === -1) {
            status.className = "status error";
            status.textContent = "❌ Kolom 'NAMA SISWA' tidak ditemukan di baris pertama Excel!";
            return;
          }

          dataSiswaExcel = [];
          for (let i = 1; i < json.length; i++) {
            const row = json[i];
            if (row[idxNama]) {
              dataSiswaExcel.push({ nama: String(row[idxNama]).trim() });
            }
          }

          // Tampilkan Preview
          document.getElementById("previewArea").style.display = "block";
          document.getElementById("btnSimpan").style.display = "block";
          
          const tbody = document.getElementById("previewTbody");
          tbody.innerHTML = "";
          dataSiswaExcel.slice(0, 5).forEach((s, i) => {
            tbody.innerHTML += `<tr><td>${i+1}</td><td>${s.nama}</td></tr>`;
          });

          status.className = "status success";
          status.textContent = `✅ Berhasil membaca ${dataSiswaExcel.length} data siswa. Klik tombol simpan.`;

        } catch (err) {
          console.error(err);
          status.className = "status error";
          status.textContent = "❌ Gagal membaca file: " + err.message;
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function simpanDataExcel() {
      if (dataSiswaExcel.length === 0) return;

      let listLama = JSON.parse(localStorage.getItem('siTatibSiswa') || "[]");
      let semuaSiswa = [...new Set([...listLama, ...dataSiswaExcel.map(s => s.nama)])];

      localStorage.setItem('siTatibSiswa', JSON.stringify(semuaSiswa));
      
      alert(`✅ Berhasil menyimpan total ${semuaSiswa.length} siswa ke sistem!`);
      
      // Kembali ke halaman utama setelah simpan
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
