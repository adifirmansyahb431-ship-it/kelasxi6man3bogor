<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Induk - SIPADAK XI-6</title>
  
  <style>
    :root { 
      --dark-bg: #070b19; 
      --sidebar-bg: #0d1326;
      --neon-cyan: #00f3ff; 
      --text: #e2e8f0; 
      --hover-bg: rgba(0, 243, 255, 0.1);
    }
    * { box-sizing: border-box; }
    
    body { 
      margin: 0; 
      font-family: 'Segoe UI', sans-serif; 
      background-color: var(--dark-bg);
      color: var(--text); 
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden; 
    }

    /* HEADER ATAS */
    .header { 
      background: rgba(7, 11, 25, 0.95); 
      color: var(--neon-cyan); 
      display: flex; 
      align-items: center; 
      gap: 15px; 
      padding: 10px 20px; 
      border-bottom: 2px solid var(--neon-cyan); 
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
      z-index: 100;
      height: 70px;
    }
    .header img { height: 45px; width: 45px; background: white; border-radius: 8px; padding: 2px; object-fit: cover; }
    .header .brand { flex: 1; font-size: 18px; font-weight: 800; line-height: 1.2; text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);}
    .header .brand small { display: block; font-size: 12px; color: #aaa; font-weight: 600; text-shadow: none;}
    .header .logout { background: #e74c3c; color: white; border: none; border-radius: 8px; padding: 8px 15px; font-weight: 700; cursor: pointer; box-shadow: 0 0 10px rgba(231, 76, 60, 0.5); }

    /* AREA UTAMA (KIRI & KANAN) */
    .main-wrapper {
      display: flex;
      flex: 1;
      height: calc(100vh - 70px);
    }

    /* SIDEBAR KIRI */
    .sidebar {
      width: 260px;
      background-color: var(--sidebar-bg);
      border-right: 1px solid rgba(0, 243, 255, 0.2);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      padding: 15px 0;
      box-shadow: 2px 0 10px rgba(0,0,0,0.5);
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      color: #aaa;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: 0.2s;
      cursor: pointer;
      border-left: 4px solid transparent;
    }
    
    .menu-item:hover, .menu-item.active {
      background-color: var(--hover-bg);
      color: var(--neon-cyan);
      border-left-color: var(--neon-cyan);
    }

    .menu-item .icon {
      font-size: 18px;
      filter: drop-shadow(0 0 5px rgba(0, 243, 255, 0.5));
    }

    /* KONTEN KANAN */
    .content-area {
      flex: 1;
      background-color: var(--dark-bg);
      position: relative;
      overflow: hidden;
    }

    /* LAYAR SAMBUTAN (Muncul saat pertama kali buka) */
    .welcome-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--neon-cyan);
      text-align: center;
      padding: 20px;
    }
    .welcome-screen h2 { text-shadow: 0 0 10px rgba(0, 243, 255, 0.5); margin-bottom: 10px; font-size: 28px;}
    .welcome-screen p { color: #aaa; font-size: 16px; }

    /* IFRAME (Tersembunyi di awal, muncul saat menu diklik) */
    #mainFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: none; /* Sembunyikan dulu */
      background: white; 
    }

  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <img src="fotogroupxi-6.png" alt="logo" />
    <div class="brand">
      SIPADAK XI-6
      <small id="infoUser">MAN 3 BOGOR</small>
    </div>
    <button class="logout" onclick="logout()">🚪 KELUAR</button>
  </div>

  <!-- AREA UTAMA -->
  <div class="main-wrapper">
    
    <!-- SIDEBAR KIRI (Menu akan diisi JS) -->
    <div class="sidebar" id="sidebar"></div>

    <!-- KONTEN KANAN -->
    <div class="content-area">
      <!-- Layar Sambutan -->
      <div class="welcome-screen" id="welcomeScreen">
        <h2 id="welcomeText">Selamat Datang!</h2>
        <p>Silakan pilih menu di sebelah kiri untuk mulai mengelola data.</p>
      </div>
      
      <!-- Iframe untuk memuat halaman -->
      <iframe id="mainFrame" src=""></iframe>
    </div>
  </div>

  <script>
    // Cek Sesi Login
    const sudahLogin = localStorage.getItem("siTatibLogin");
    const role = localStorage.getItem("siTatibRole");
    const nama = localStorage.getItem("siTatibNama");

    if (sudahLogin !== "true" || role === "siswa" || !nama) {
      window.location.href = "index.html";
    } else {
      document.getElementById("infoUser").innerHTML = `MAN 3 BOGOR - SIPADAK <br><span style="color:#00f3ff;font-size:11px;">Login: ${nama}</span>`;
      document.getElementById("welcomeText").textContent = `Selamat Datang, ${nama}!`;

      // Daftar Menu (TIDAK ADA Dashboard lagi di sini)
      const semuaMenu = [
        { id: "menuPelanggaran", href: "pelanggaran.html", icon: "📝", title: "Input Pelanggaran" },
        { id: "menuRekap", href: "rekap.html", icon: "📊", title: "Rekap Poin" },
        { id: "menuNilai", href: "nilai.html", icon: "⭐", title: "Input Nilai" },
        { id: "menuAbsensi", href: "absensi.html", icon: "📋", title: "Absensi Siswa" },
        { id: "menuRekapBulanan", href: "rekap-bulanan.html", icon: "📅", title: "Rekap Bulanan" },
        { id: "menuKelolaSiswa", href: "kelola-siswa.html", icon: "📤", title: "Kelola Siswa" },
        { id: "menuKelolaAkun", href: "kelola-akun.html", icon: "👤", title: "Akun Siswa" },
        { id: "menuKasKelas", href: "kas-kelas.html", icon: "💰", title: "Kas Kelas" }
      ];

      // Filter Menu Berdasarkan Role
      let menuTampil = [];
      if (role === "admin") {
        menuTampil = semuaMenu;
      } else if (role === "sekretaris") {
        menuTampil = semuaMenu.filter(m => ["menuAbsensi", "menuRekapBulanan", "menuKasKelas"].includes(m.id));
      } else if (role === "bendahara") {
        menuTampil = semuaMenu.filter(m => m.id === "menuKasKelas");
      }

      // Render Menu ke Sidebar
      const sidebar = document.getElementById("sidebar");
      menuTampil.forEach(menu => {
        const a = document.createElement("a");
        a.className = "menu-item";
        a.href = "javascript:void(0)";
        a.innerHTML = `<div class="icon">${menu.icon}</div> ${menu.title}`;
        
        // Event saat menu diklik
        a.onclick = function() {
          bukaHalaman(menu.href, this);
        };
        sidebar.appendChild(a);
      });
    }

    // Fungsi membuka halaman di Iframe
    function bukaHalaman(url, elementMenu) {
      // 1. Sembunyikan layar sambutan
      document.getElementById("welcomeScreen").style.display = "none";
      
      // 2. Tampilkan iframe dan muat URL
      const iframe = document.getElementById("mainFrame");
      iframe.style.display = "block";
      iframe.src = url;

      // 3. Highlight menu yang aktif
      document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
      elementMenu.classList.add('active');
    }

    // Fungsi Kembali ke Sambutan (Dipanggil dari dalam iframe)
    window.tutupHalaman = function() {
      const iframe = document.getElementById("mainFrame");
      iframe.style.display = "none";
      iframe.src = "";
      document.getElementById("welcomeScreen").style.display = "flex";
      document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
    }

    // Fungsi Logout
    function logout() {
      if (!confirm("Yakin keluar dari aplikasi?")) return;
      localStorage.removeItem("siTatibLogin");
      localStorage.removeItem("siTatibRole");
      localStorage.removeItem("siTatibNama");
      localStorage.removeItem("siTatibEmail");
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
