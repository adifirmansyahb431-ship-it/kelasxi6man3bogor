<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profil Saya - SIPADAK XI-6</title>
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, updateDoc, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBZIzD2337cdCxhV2EdcDMK3iwnaR0GiS4",
      authDomain: "sipadak-xi6.firebaseapp.com",
      projectId: "sipadak-xi6",
      storageBucket: "sipadak-xi6.firebasestorage.app",
      messagingSenderId: "981787419124",
      appId: "1:981787419124:web:6622e4bd0b928e9bea19a1"
    };

    const app = initializeApp(firebaseConfig);
    window.db = getFirestore(app);
    window.fbFunc = { doc, updateDoc, collection, addDoc, getDocs, query, where };
    
    window.dispatchEvent(new Event('firebaseReady'));
  </script>

  <style>
    /* --- GAYA GEN Z: BACKGROUND FOTO FULL LAYAR + GLASSMORPHISM --- */
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

    body { 
      font-family: 'Poppins', sans-serif; 
      
      /* FOTO GRUP SEBAGAI BACKGROUND LAYAR PENUH */
      background-image: linear-gradient(rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0.6)), url('2026-10-22 at 12.19.59.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      
      margin: 0; 
      padding: 20px; 
      min-height: 100vh;
    }

    .header { 
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      color: #333; 
      padding: 15px 22px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-radius: 14px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
    }
    .header h1 { margin: 0; font-size: 20px; font-weight: 700; color: #4a2c7a; }
    
    .btn-logout { 
      background: #ff4757; 
      color: white; 
      border: none; 
      padding: 8px 15px; 
      border-radius: 20px; 
      font-weight: 700; 
      cursor: pointer; 
      box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
      transition: 0.3s;
    }
    .btn-logout:hover { transform: scale(1.05); }

    /* EFEK KACA (GLASSMORPHISM) UNTUK CARD */
    .card { 
      background: rgba(255, 255, 255, 0.85); 
      backdrop-filter: blur(12px); 
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      
      padding: 25px; 
      border-radius: 24px; 
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15); 
      max-width: 700px; /* Diperlebar agar foto dan form muat */
      margin: 0 auto; 
      margin-bottom: 20px; 
      position: relative;
      z-index: 1;
    }
    
    h2, h3 { color: #4a2c7a; text-align: center; margin-top: 0; font-weight: 700; }
    
    label { font-weight: 600; font-size: 13px; display: block; margin-bottom: 5px; margin-top: 15px; color: #4a2c7a; }
    
    input { 
      width: 100%; 
      padding: 12px 15px; 
      border: 2px solid rgba(255,255,255,0.5); 
      border-radius: 12px; 
      box-sizing: border-box; 
      background: rgba(255,255,255,0.9); 
      font-family: 'Poppins', sans-serif;
      transition: 0.3s;
    }
    input:focus { outline: none; border-color: #a18cd1; background: white; }
    input[readonly] { background: rgba(230, 230, 230, 0.8); color: #666; }
    
    /* TOMBOL WARNA NEON/POP */
    .btn-save { 
      background: #00b894; 
      color: white; 
      border: none; 
      padding: 14px; 
      border-radius: 12px; 
      width: 100%; 
      font-weight: 700; 
      cursor: pointer; 
      margin-top: 20px; 
      font-size: 15px;
      box-shadow: 0 4px 15px rgba(0, 184, 148, 0.4);
      transition: 0.3s;
    }
    .btn-save:hover { transform: translateY(-2px); }

    .btn-password { 
      background: #0984e3; 
      color: white; 
      border: none; 
      padding: 14px; 
      border-radius: 12px; 
      width: 100%; 
      font-weight: 700; 
      cursor: pointer; 
      margin-top: 10px; 
      font-size: 15px; 
      box-shadow: 0 4px 15px rgba(9, 132, 227, 0.4);
      transition: 0.3s;
    }
    .btn-password:hover { transform: translateY(-2px); }

    .btn-absen { 
      background: #fdcb6e; 
      color: #333; 
      border: none; 
      padding: 14px; 
      border-radius: 12px; 
      width: 100%; 
      font-weight: 700; 
      cursor: pointer; 
      margin-top: 10px; 
      font-size: 15px; 
      box-shadow: 0 4px 15px rgba(253, 203, 110, 0.5);
      transition: 0.3s;
    }
    .btn-absen:hover { transform: translateY(-2px); }
    
    /* --- CSS UNTUK FOTO POTRET & FORM BERDAMPINGAN --- */
    .profil-container {
      display: flex;
      gap: 25px;
      align-items: flex-start;
      margin-top: 15px;
    }

    .profil-kiri {
      flex: 0 0 160px; /* Lebar tetap untuk foto potret */
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .profil-kanan {
      flex: 1; /* Sisa ruang untuk form */
    }

    /* FOTO PROFIL BENTUK POTRET (PERSEGI PANJANG KE BAWAH) */
    .foto-profil { 
      width: 160px; 
      height: 220px; /* Tinggi lebih besar dari lebar */
      object-fit: cover; 
      border-radius: 16px; /* Sudut membulat */
      border: 4px solid white; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    /* RESPONSIF UNTUK HP: FOTO PINDAH KE ATAS */
    @media (max-width: 600px) {
      .profil-container {
        flex-direction: column;
        align-items: center;
      }
      .profil-kiri {
        flex: 0 0 auto;
        margin-bottom: 15px;
      }
    }

    #statusLokasi { text-align: center; font-size: 13px; font-weight: 700; margin-top: 10px; }
    
    hr { margin-top: 30px; margin-bottom: 15px; border: 1px solid rgba(0,0,0,0.1); }

    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; background: rgba(255,255,255,0.9); border-radius: 10px; overflow: hidden; }
    th, td { border-bottom: 1px solid rgba(0,0,0,0.05); padding: 10px; text-align: left; }
    th { background: rgba(255,255,255,1); color: #4a2c7a; }
    .hadir { color: #00b894; font-weight: 700; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Profil Siswa</h1>
    <button class="btn-logout" onclick="logout()">KELUAR</button>
  </div>

  <div class="card">
    <h2>Data Diri Saya</h2>
    
    <!-- WADAH FOTO DAN FORM BERDAMPINGAN -->
    <div class="profil-container">
      
      <!-- BAGIAN KIRI: FOTO POTRET & UPLOAD -->
      <div class="profil-kiri">
        <img id="fotoTampil" src="https://ui-avatars.com/api/?name=Siswa&background=a18cd1&color=fff" class="foto-profil" alt="Foto Profil">
        <label style="text-align: center; margin-top: 10px; font-size: 12px;">Upload Foto Baru</label>
        <input type="file" id="inFoto" accept="image/*" style="font-size: 11px; padding: 5px; width: 100%;">
      </div>

      <!-- BAGIAN KANAN: FORM DATA -->
      <div class="profil-kanan">
        <form id="formProfil" onsubmit="simpanProfil(event)">
          <label>Nama Lengkap</label>
          <input type="text" id="inNama" readonly>
          
          <label>NIS</label>
          <input type="text" id="inNis" readonly>

          <label>No. HP (Bisa Diedit)</label>
          <input type="text" id="inHp" placeholder="08xxxx">

          <label>Alamat (Bisa Diedit)</label>
          <input type="text" id="inAlamat" placeholder="Alamat lengkap">

          <button type="submit" class="btn-save">💾 SIMPAN PERUBAHAN</button>
        </form>
      </div>

    </div>
    <!-- AKHIR WADAH -->

    <hr>
    <h3>Ganti Password</h3>
    <label>Password Baru (Min. 6 Karakter)</label>
    <input type="password" id="inPassBaru" placeholder="Masukkan password baru Anda">
    <button type="button" onclick="gantiPassword()" class="btn-password">🔑 SIMPAN PASSWORD BARU</button>

    <hr>
    <h3>Absensi Kehadiran</h3>
    <button type="button" onclick="absensiLokasi()" class="btn-absen">📍 ABSEN SEKARANG (Cek Lokasi)</button>
    <p id="statusLokasi"></p>
  </div>

  <div class="card">
    <h3>Riwayat Absensi Saya</h3>
    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th style="text-align:center;">No</th>
            <th>Tanggal</th>
            <th>Status</th>
            <th>Keterangan</th>
          </tr>
        </thead>
        <tbody id="tabelRiwayat">
          <tr><td colspan="4" style="text-align:center;">Memuat data...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const dataLogin = JSON.parse(localStorage.getItem("dataSiswaLogin"));

    if (!dataLogin) {
      alert("Sesi tidak valid. Silakan login ulang.");
      window.location.href = "index.html";
    } else {
      document.getElementById("inNama").value = dataLogin.nama || "";
      document.getElementById("inNis").value = dataLogin.nis || "";
      document.getElementById("inHp").value = dataLogin.noHp || "";
      document.getElementById("inAlamat").value = dataLogin.alamat || "";
      
      if (dataLogin.foto) {
        document.getElementById("fotoTampil").src = dataLogin.foto;
      }

      muatRiwayatAbsensi();
    }

    async function simpanProfil(e) {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]');
      btn.textContent = "⏳ Menyimpan...";
      btn.disabled = true;

      const noHp = document.getElementById("inHp").value;
      const alamat = document.getElementById("inAlamat").value;
      const fileFoto = document.getElementById("inFoto").files[0];

      let fotoBase64 = document.getElementById("fotoTampil").src;

      if (fileFoto) {
        fotoBase64 = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (e) => resolve(e.target.result);
          reader.readAsDataURL(fileFoto);
        });
      }

      try {
        const { doc, updateDoc } = window.fbFunc;
        const db = window.db;

        await updateDoc(doc(db, "Siswa", dataLogin.idDoc), {
          noHp: noHp,
          alamat: alamat,
          foto: fotoBase64
        });
        
        alert("✅ Profil berhasil diperbarui!");
        
        dataLogin.noHp = noHp;
        dataLogin.alamat = alamat;
        dataLogin.foto = fotoBase64;
        localStorage.setItem("dataSiswaLogin", JSON.stringify(dataLogin));
        
        document.getElementById("fotoTampil").src = fotoBase64;
        
      } catch (error) {
        console.error(error);
        alert("❌ Gagal menyimpan: " + error.message);
      } finally {
        btn.textContent = "💾 SIMPAN PERUBAHAN";
        btn.disabled = false;
      }
    }

    async function gantiPassword() {
      const passBaru = document.getElementById("inPassBaru").value;

      if (passBaru.length < 6) {
        alert("❌ Password minimal 6 karakter!");
        return;
      }

      if (!confirm("Yakin ingin mengganti password Anda?")) return;

      try {
        const { doc, updateDoc } = window.fbFunc;
        const db = window.db;

        await updateDoc(doc(db, "Siswa", dataLogin.idDoc), {
          password: passBaru
        });

        alert("✅ Password berhasil diubah! Gunakan password baru ini saat login.");
        document.getElementById("inPassBaru").value = ""; 

      } catch (error) {
        console.error(error);
        alert("❌ Gagal mengganti password: " + error.message);
      }
    }

    async function muatRiwayatAbsensi() {
      const tbody = document.getElementById("tabelRiwayat");
      
      try {
        if (!window.fbFunc) {
          setTimeout(muatRiwayatAbsensi, 500); 
          return;
        }

        const { collection, getDocs, query, where } = window.fbFunc;
        const db = window.db;

        const q = query(collection(db, "Absensi"), where("nama", "==", dataLogin.nama));
        const querySnapshot = await getDocs(q);

        if (querySnapshot.empty) {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Belum ada riwayat absensi.</td></tr>';
          return;
        }

        let dataRiwayat = [];
        querySnapshot.forEach((doc) => {
          dataRiwayat.push(doc.data());
        });

        dataRiwayat.sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));

        tbody.innerHTML = "";
        dataRiwayat.forEach((row, index) => {
          let tglFormat = row.tanggal || "-";
          try {
             tglFormat = new Date(row.tanggal).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
          } catch(e) {}

          tbody.innerHTML += `
            <tr>
              <td style="text-align:center;">${index + 1}</td>
              <td>${tglFormat}</td>
              <td class="hadir">${row.status || "-"}</td>
              <td>${row.keterangan || "-"}</td>
            </tr>
          `;
        });

      } catch (error) {
        console.error("Error memuat riwayat:", error);
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:red;">Gagal: ${error.message}</td></tr>`;
      }
    }

    // ==========================================
    // ABSENSI LOKASI + VALIDASI JAM
    // ==========================================
    const KOORDINAT_SEKOLAH = { lat: -6.4582213, lng: 107.0547609 }; 
    const RADIUS_MAKSIMAL_METER = 200; 

    function absensiLokasi() {
      const status = document.getElementById("statusLokasi");
      status.textContent = "⏳ Mendeteksi lokasi Anda...";
      status.style.color = "#333";

      // VALIDASI JAM
      const sekarang = new Date();
      const jam = sekarang.getHours();
      const menit = sekarang.getMinutes();
      const waktuSekarang = jam + (menit / 60); 
      
      const batasMasuk = 6.5;  // Jam 06:30
      const batasPulang = 15.5; // Jam 15:30

      if (waktuSekarang > batasMasuk && waktuSekarang < batasPulang) {
        status.innerHTML = `❌ <b>Gagal!</b> Absensi hanya dibuka pada:<br>🕒 Jam 06:00 - 06:30 WIB (Masuk)<br>🕒 Jam 15:30 WIB ke atas (Pulang)<br><br>Waktu sekarang: ${jam}:${menit < 10 ? '0'+menit : menit} WIB`;
        status.style.color = "red";
        return;
      }

      if (!navigator.geolocation) {
        status.textContent = "❌ Browser Anda tidak mendukung fitur lokasi.";
        status.style.color = "red";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const latSiswa = position.coords.latitude;
          const lngSiswa = position.coords.longitude;

          const jarak = hitungJarak(latSiswa, lngSiswa, KOORDINAT_SEKOLAH.lat, KOORDINAT_SEKOLAH.lng);
          
          if (jarak <= RADIUS_MAKSIMAL_METER) {
            status.textContent = `⏳ Jarak sesuai (${Math.round(jarak)}m). Mengecek data absensi...`;
            status.style.color = "#333";

            try {
              const { collection, getDocs, addDoc, query, where } = window.fbFunc;
              const db = window.db;
              
              const tglHariIni = new Date().toISOString().split('T')[0]; 
              
              const q = query(collection(db, "Absensi"), where("nama", "==", dataLogin.nama), where("tanggal", "==", tglHariIni));
              const querySnapshot = await getDocs(q);

              if (!querySnapshot.empty) {
                status.textContent = `⚠️ Anda sudah melakukan absensi hari ini (${tglHariIni}).`;
                status.style.color = "#e67e22";
                return; 
              }

              let tipeAbsen = waktuSekarang <= batasMasuk ? "Masuk" : "Pulang";
              const jamSekarangStr = new Date().toLocaleTimeString('id-ID');
              
              await addDoc(collection(db, "Absensi"), {
                tanggal: tglHariIni,
                nama: dataLogin.nama,
                nis: dataLogin.nis,
                status: "Hadir",
                keterangan: `Absen ${tipeAbsen} (Jam: ${jamSekarangStr})`
              });

              status.textContent = `✅ Absensi ${tipeAbsen} Berhasil! Jarak Anda ${Math.round(jarak)} meter dari sekolah.`;
              status.style.color = "green";
              
              muatRiwayatAbsensi();

            } catch (error) {
              console.error(error);
              status.textContent = "❌ Gagal memeriksa atau menyimpan absensi.";
              status.style.color = "red";
            }

          } else {
            status.textContent = `❌ Gagal! Anda berada di luar area sekolah (Jarak: ${Math.round(jarak)} meter).`;
            status.style.color = "red";
          }
        },
        (error) => {
          status.textContent = "❌ Gagal mengambil lokasi. Pastikan GPS aktif dan izin diberikan.";
          status.style.color = "red";
        },
        { enableHighAccuracy: true } 
      );
    }

    function hitungJarak(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const p1 = lat1 * Math.PI/180;
      const p2 = lat2 * Math.PI/180;
      const dp = (lat2-lat1) * Math.PI/180;
      const dl = (lon2-lon1) * Math.PI/180;

      const a = Math.sin(dp/2) * Math.sin(dp/2) +
                Math.cos(p1) * Math.cos(p2) *
                Math.sin(dl/2) * Math.sin(dl/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

      return R * c;
    }

    function logout() {
      if(confirm("Yakin ingin keluar?")) {
        localStorage.removeItem("dataSiswaLogin");
        localStorage.removeItem("siTatibLogin");
        localStorage.removeItem("siTatibRole");
        localStorage.removeItem("siTatibNama");
        window.location.href = "index.html";
      }
    }
  </script>
</body>
</html>
