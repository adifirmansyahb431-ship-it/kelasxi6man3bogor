<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profil Saya - SIPADAK XI-6</title>
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    // Tambahkan collection, getDocs, setDoc untuk fitur absensi
    import { getFirestore, doc, updateDoc, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBZIzD2337cdCxhV2EdcDMK3iwnaR0GiS4",
      authDomain: "sipadak-xi6.firebaseapp.com",
      projectId: "sipadak-xi6",
      storageBucket: "sipadak-xi6.firebasestorage.app",
      messagingSenderId: "981787419124",
      appId: "1:981787419124:web:6622e4bd0b928e9bea19a1"
    };

    const app = initializeApp(firebaseConfig);
    window.db = getFirestore(app);
    window.fbFunc = { doc, updateDoc, collection, addDoc, getDocs, query, where };
  </script>

  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f3f5f4; margin: 0; padding: 20px; }
    .header { background: #0a3622; color: #f6e27a; padding: 15px 22px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid #d4af37; margin: -20px -20px 20px -20px; }
    .header h1 { margin: 0; font-size: 20px; }
    .btn-logout { background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .card { background: white; padding: 25px; border-radius: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto; }
    h2 { color: #0a3622; text-align: center; margin-top: 0; }
    label { font-weight: bold; font-size: 13px; display: block; margin-bottom: 5px; margin-top: 15px; }
    input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
    input[readonly] { background: #eee; }
    button.btn-save { background: #16a085; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 20px; font-size: 15px;}
    .btn-absen { background: #e67e22; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 15px; }
    .foto-profil { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; display: block; margin: 0 auto 15px; border: 3px solid #16a085; }
    #statusLokasi { text-align: center; font-size: 13px; font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Profil Siswa</h1>
    <button class="btn-logout" onclick="logout()">KELUAR</button>
  </div>

  <div class="card">
    <h2>Data Diri Saya</h2>
    
    <img id="fotoTampil" src="https://ui-avatars.com/api/?name=Siswa&background=16a085&color=fff" class="foto-profil" alt="Foto Profil">
    
    <form id="formProfil" onsubmit="simpanProfil(event)">
      <label>Nama Lengkap</label>
      <input type="text" id="inNama" readonly>
      
      <label>NIS</label>
      <input type="text" id="inNis" readonly>

      <label>No. HP (Bisa Diedit)</label>
      <input type="text" id="inHp" placeholder="08xxxx">

      <label>Alamat (Bisa Diedit)</label>
      <input type="text" id="inAlamat" placeholder="Alamat lengkap">

      <label>Upload Foto Baru (Opsional)</label>
      <input type="file" id="inFoto" accept="image/*">

      <button type="submit" class="btn-save">💾 SIMPAN PERUBAHAN</button>
    </form>

    <!-- FITUR ABSENSI LOKASI -->
    <hr style="margin-top: 30px; border: 1px solid #eee;">
    <h3 style="text-align: center; color: #0a3622;">Absensi Kehadiran</h3>
    <button type="button" onclick="absensiLokasi()" class="btn-absen">📍 ABSEN SEKARANG (Cek Lokasi)</button>
    <p id="statusLokasi"></p>
    <!-- END FITUR ABSENSI LOKASI -->

  </div>

  <script>
    // Ambil data dari LocalStorage (hasil login di index.html)
    const dataLogin = JSON.parse(localStorage.getItem("dataSiswaLogin"));

    if (!dataLogin) {
      alert("Sesi tidak valid. Silakan login ulang.");
      window.location.href = "index.html";
    } else {
      // Tampilkan data ke form
      document.getElementById("inNama").value = dataLogin.nama || "";
      document.getElementById("inNis").value = dataLogin.nis || "";
      document.getElementById("inHp").value = dataLogin.noHp || "";
      document.getElementById("inAlamat").value = dataLogin.alamat || "";
      
      if (dataLogin.foto) {
        document.getElementById("fotoTampil").src = dataLogin.foto;
      }
    }

    async function simpanProfil(e) {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.textContent = "⏳ Menyimpan...";
      btn.disabled = true;

      const noHp = document.getElementById("inHp").value;
      const alamat = document.getElementById("inAlamat").value;
      const fileFoto = document.getElementById("inFoto").files[0];

      let fotoBase64 = document.getElementById("fotoTampil").src;

      if (fileFoto) {
        fotoBase64 = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (e) => resolve(e.target.result);
          reader.readAsDataURL(fileFoto);
        });
      }

      try {
        const { doc, updateDoc } = window.fbFunc;
        const db = window.db;

        // Update data di Firestore berdasarkan ID Dokumen
        await updateDoc(doc(db, "Siswa", dataLogin.idDoc), {
          noHp: noHp,
          alamat: alamat,
          foto: fotoBase64
        });
        
        alert("✅ Profil berhasil diperbarui!");
        
        // Update LocalStorage
        dataLogin.noHp = noHp;
        dataLogin.alamat = alamat;
        dataLogin.foto = fotoBase64;
        localStorage.setItem("dataSiswaLogin", JSON.stringify(dataLogin));
        
        document.getElementById("fotoTampil").src = fotoBase64;
        
      } catch (error) {
        console.error(error);
        alert("❌ Gagal menyimpan: " + error.message);
      } finally {
        btn.textContent = "💾 SIMPAN PERUBAHAN";
        btn.disabled = false;
      }
    }

    function logout() {
      if(confirm("Yakin ingin keluar?")) {
        localStorage.removeItem("dataSiswaLogin");
        localStorage.removeItem("siTatibLogin");
        localStorage.removeItem("siTatibRole");
        localStorage.removeItem("siTatibNama");
        window.location.href = "index.html";
      }
    }

    // ==========================================
    // FITUR ABSENSI BERDASARKAN LOKASI (GPS)
    // ==========================================
    
    // Koordinat MAN 3 Bogor
    const KOORDINAT_SEKOLAH = { lat: -6.4582213, lng: 107.0547609 }; 
    const RADIUS_MAKSIMAL_METER = 200; // Toleransi jarak 200 meter

    function absensiLokasi() {
      const status = document.getElementById("statusLokasi");
      status.textContent = "⏳ Mendeteksi lokasi Anda...";
      status.style.color = "#333";

      if (!navigator.geolocation) {
        status.textContent = "❌ Browser Anda tidak mendukung fitur lokasi.";
        status.style.color = "red";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const latSiswa = position.coords.latitude;
          const lngSiswa = position.coords.longitude;

          const jarak = hitungJarak(latSiswa, lngSiswa, KOORDINAT_SEKOLAH.lat, KOORDINAT_SEKOLAH.lng);
          
          if (jarak <= RADIUS_MAKSIMAL_METER) {
            status.textContent = `⏳ Jarak sesuai (${Math.round(jarak)}m). Menyimpan absensi...`;
            status.style.color = "#333";

            // Simpan ke Firestore (Koleksi "Absensi")
            try {
              const { collection, addDoc } = window.fbFunc;
              const db = window.db;
              
              const tglHariIni = new Date().toISOString().split('T')[0]; // Format YYYY-MM-DD
              const jamSekarang = new Date().toLocaleTimeString('id-ID');

              await addDoc(collection(db, "Absensi"), {
                tanggal: tglHariIni,
                nama: dataLogin.nama,
                nis: dataLogin.nis,
                status: "Hadir",
                keterangan: `Absen Lokasi (Jam: ${jamSekarang})`
              });

              status.textContent = `✅ Absensi Berhasil! Jarak Anda ${Math.round(jarak)} meter dari sekolah.`;
              status.style.color = "green";
            } catch (error) {
              console.error(error);
              status.textContent = "❌ Gagal menyimpan absensi ke database.";
              status.style.color = "red";
            }

          } else {
            status.textContent = `❌ Gagal! Anda berada di luar area sekolah (Jarak: ${Math.round(jarak)} meter).`;
            status.style.color = "red";
          }
        },
        (error) => {
          status.textContent = "❌ Gagal mengambil lokasi. Pastikan GPS aktif dan izin diberikan.";
          status.style.color = "red";
        },
        { enableHighAccuracy: true } // Meminta akurasi GPS tertinggi
      );
    }

    // Fungsi Rumus Haversine untuk menghitung jarak antara 2 koordinat
    function hitungJarak(lat1, lon1, lat2, lon2) {
      const R = 6371e3; // Radius bumi dalam meter
      const p1 = lat1 * Math.PI/180;
      const p2 = lat2 * Math.PI/180;
      const dp = (lat2-lat1) * Math.PI/180;
      const dl = (lon2-lon1) * Math.PI/180;

      const a = Math.sin(dp/2) * Math.sin(dp/2) +
                Math.cos(p1) * Math.cos(p2) *
                Math.sin(dl/2) * Math.sin(dl/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

      return R * c; // Hasil dalam meter
    }
  </script>
</body>
</html>
